# cargo deny check: the Rust supply chain of the workspace (the Dependency
# Audit workflow). Advisories from RustSec, the licences the dependencies
# may carry, duplicate and banned crates, and where crates come from.

[graph]
all-features = false

[advisories]
# Every RustSec advisory fails, unmaintained crates included, unless it is
# listed here with why it does not apply.
ignore = [
  # bincode and unsafe-libyaml (through serde_yaml) are unmaintained, with
  # no maintained release to move to; only the parity test harness uses them
  # (herdr-api's wire, the scenarios' YAML), never a shipped binary.
  { id = "RUSTSEC-2025-0141", reason = "bincode: parity harness only" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: parity harness only" },
  # crypto-bigint 0.5 timing variability, through p256 0.13 (Web Push's
  # VAPID signature and payload ECDH). The fix is in the RustCrypto 0.14
  # generation (p256, aes-gcm, hkdf, sha2 together), not yet taken.
  { id = "RUSTSEC-2026-0387", reason = "p256 0.13 for Web Push; needs the RustCrypto 0.14 move" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "MIT-0",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# The licences a shipped Roamgate binary may carry: cargo-about's config
# for the crates linked into `roamgate`, and the list `cargo xtask package`
# also holds the npm packages bundled into roamgate-pi and the web app to
# (xtask/src/notices.rs). A licence outside it fails packaging: review it,
# then add it here.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "EPL-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The dependencies of build scripts and tests are not in the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true

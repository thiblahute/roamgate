[package]
name = "xtask"
version = "0.0.0"
description = "Builds, packages and checks Roamgate's release targets (targets.toml): cargo xtask --help"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
# xz2, not liblzma: one package links lzma, and the voice helper pulls xz2.
xz2 = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

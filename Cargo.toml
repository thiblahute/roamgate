# The Rust side of Roamgate (docs: the Rust migration plan, section 6.2).
# `roamgate` (crates/roamgate) is the server binary, the parity suite drives
# a server from outside, xtask builds and packages the release targets of
# targets.toml. The voice helper is a member that only builds when asked
# (`-p roamgate-voice`, or from voice/helper): it pulls GStreamer's bundle.
[workspace]
resolver = "3"
members = ["crates/roamgate", "parity", "parity/herdr-api", "voice/helper", "xtask"]
default-members = ["crates/roamgate", "parity", "parity/herdr-api", "xtask"]
# Its own workspace: a benchmark with its own lockfile.
exclude = ["scripts/bench-terminal"]

[workspace.package]
# The release version, bumped with package.json by scripts/prepare-release.ts.
version = "0.8.15"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
strip = true

# The voice helper's: gstreamer-rs's prebuilt bundle support, until it is
# merged: https://gitlab.freedesktop.org/gstreamer/gstreamer-rs/-/merge_requests/1980
[patch."https://gitlab.freedesktop.org/gstreamer/gstreamer-rs"]
gstreamer = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }

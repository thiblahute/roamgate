# The voice helper's: any-tts with the Metal and CUDA speedups, streaming
# Qwen3-TTS decoding and voice cloning, until they are merged upstream.
[patch.crates-io]
any-tts = { git = "https://github.com/thiblahute/any-tts", branch = "roamgate" }

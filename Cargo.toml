# The Rust side of Roamgate (docs: the Rust migration plan, section 6.2).
# `roamgate` (crates/roamgate) is the server binary, `roamgate-ws`
# (crates/roamgate-ws) its /ws transport, `roamgate-protocol`,
# `roamgate-base` and `roamgate-exec` the foundation crates (wire types,
# storage and process plumbing), `roamgate-channel` the internal channel
# to the Bun server while families move (`roamgate core`; deleted at the
# cut-over), the parity suite drives a server
# from outside, xtask builds and packages the release targets of
# targets.toml. The voice helper (voice/helper) is its own workspace, with
# its own lockfile and [patch] sections: building `roamgate` never resolves
# its git dependencies (GStreamer's crates, its plugins, any-tts).
[workspace]
resolver = "3"
members = ["crates/roamgate", "crates/roamgate-activity", "crates/roamgate-agent-client", "crates/roamgate-agents", "crates/roamgate-archive", "crates/roamgate-assistant", "crates/roamgate-base", "crates/roamgate-claude", "crates/roamgate-cli", "crates/roamgate-connections", "crates/roamgate-conversation", "crates/roamgate-exec", "crates/roamgate-forge", "crates/roamgate-git", "crates/roamgate-herdr", "crates/roamgate-history", "crates/roamgate-http", "crates/roamgate-mr-reviews", "crates/roamgate-notify", "crates/roamgate-pi", "crates/roamgate-protocol", "crates/roamgate-review", "crates/roamgate-channel", "crates/roamgate-voice-server", "crates/roamgate-work", "crates/roamgate-workspace", "crates/roamgate-ws", "parity", "parity/herdr-api", "xtask"]
default-members = ["crates/roamgate", "crates/roamgate-activity", "crates/roamgate-agent-client", "crates/roamgate-agents", "crates/roamgate-archive", "crates/roamgate-assistant", "crates/roamgate-base", "crates/roamgate-claude", "crates/roamgate-cli", "crates/roamgate-connections", "crates/roamgate-conversation", "crates/roamgate-exec", "crates/roamgate-forge", "crates/roamgate-git", "crates/roamgate-herdr", "crates/roamgate-history", "crates/roamgate-http", "crates/roamgate-mr-reviews", "crates/roamgate-notify", "crates/roamgate-pi", "crates/roamgate-protocol", "crates/roamgate-review", "crates/roamgate-channel", "crates/roamgate-voice-server", "crates/roamgate-work", "crates/roamgate-workspace", "crates/roamgate-ws", "parity", "parity/herdr-api", "xtask"]
# Their own workspaces, with their own lockfiles: a benchmark, and the
# voice helper.
exclude = ["scripts/bench-terminal", "voice/helper"]

[workspace.package]
# The release version, bumped with package.json by scripts/prepare-release.ts.
version = "0.8.15"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.dev]
# Line tables only: full debug info made each agent's target/ 15 to 30 GB
# and filled the desktop's disk; backtraces keep file and line.
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
strip = true

[package]
name = "roamgate-claude"
version = "0.0.0"
description = "Roamgate's headless Claude layer (Rust migration plan, section 6.2): for now the tool registry built from contract/tools/catalog.json (socket command help, parameter checks, MCP tool lists, the mod's catalog module, the SKILL's tool names); the Claude drivers, loopback MCP server and mod hub come with their subtasks"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

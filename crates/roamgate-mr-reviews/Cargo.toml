[package]
name = "roamgate-mr-reviews"
version = "0.0.0"
description = "Roamgate's MR reviews (Rust migration plan, section 6.2): the inbox, its order, pins, overrides and lanes, inference and curation, open, home and Claude panes, upstream tracking, efforts and their ledger, export and import, and the reviews agent"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fancy-regex = "0.17"
futures-util = "0.3"
rand = "0.9"
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
roamgate-assistant = { path = "../roamgate-assistant" }
roamgate-base = { path = "../roamgate-base" }
roamgate-claude = { path = "../roamgate-claude" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-forge = { path = "../roamgate-forge" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }

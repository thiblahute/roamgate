[package]
name = "roamgate-http"
version = "0.0.0"
description = "Roamgate's HTTP and RPC surface: the front's auth, login page, static files and manifest, public origin and list deltas (S18), the settings RPCs and /api/instance-settings (S13); the axum app and the /ws transport wiring follow"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
fancy-regex = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
http = "1"
http-body = "1"
lol_html = "2"
rand = "0.9"
regex = "1"
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-sidecar = { path = "../roamgate-sidecar" }
roamgate-ws = { path = "../roamgate-ws" }
roamgate-protocol = { path = "../roamgate-protocol" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt", "sync", "time"] }
unicode-width = "0.2"
roamgate-connections = { path = "../roamgate-connections" }
roamgate-herdr = { path = "../roamgate-herdr" }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tokio = { version = "1", features = ["full", "test-util"] }

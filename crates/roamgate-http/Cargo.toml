[package]
name = "roamgate-http"
version = "0.0.0"
description = "Roamgate's HTTP and RPC surface: the front's auth, login page, static files and manifest, public origin and list deltas (S18), the settings RPCs and /api/instance-settings (S13); the axum app and the /ws transport wiring follow"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
http = "1"
lol_html = "2"
rand = "0.9"
roamgate-base = { path = "../roamgate-base" }
roamgate-connections = { path = "../roamgate-connections" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "sync"] }
tracing = "0.1"
url = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[package]
name = "roamgate-pi"
version = "0.0.0"
description = "Ranger's Pi providers through the Pi sidecar (contract/wire/pi-sidecar.md): the process, started on the first Pi call and closed when idle, its JSON-RPC wire, and a Pi driver whose callbacks and tool handlers the server answers. Goes when native providers have replaced Pi (plan section 6.8)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
regex = "1"
roamgate-base = { path = "../roamgate-base" }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[package]
name = "roamgate-exec"
version = "0.0.0"
description = "Roamgate's processes and hosts: the process runner, the Host trait, SSH command lines, session slots and lanes, supervised ssh children and shell quoting"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
hex = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
regex = "1"
roamgate-base = { path = "../roamgate-base" }
roamgate-protocol = { path = "../roamgate-protocol" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

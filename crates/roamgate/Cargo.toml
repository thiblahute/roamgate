[package]
name = "roamgate"
description = "Roamgate's server: for now the skeleton the release targets are built, packaged and updated with"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "roamgate"
path = "src/main.rs"

[dependencies]
indexmap = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
roamgate-activity = { path = "../roamgate-activity" }
roamgate-agents = { path = "../roamgate-agents" }
roamgate-archive = { path = "../roamgate-archive" }
roamgate-base = { path = "../roamgate-base" }
roamgate-cli = { path = "../roamgate-cli" }
roamgate-assistant = { path = "../roamgate-assistant" }
roamgate-connections = { path = "../roamgate-connections" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-forge = { path = "../roamgate-forge" }
roamgate-git = { path = "../roamgate-git" }
roamgate-herdr = { path = "../roamgate-herdr" }
roamgate-mr-reviews = { path = "../roamgate-mr-reviews" }
roamgate-http = { path = "../roamgate-http" }
roamgate-notify = { path = "../roamgate-notify" }
roamgate-review = { path = "../roamgate-review" }
roamgate-sidecar = { path = "../roamgate-sidecar" }
roamgate-voice-server = { path = "../roamgate-voice-server" }
roamgate-work = { path = "../roamgate-work" }
roamgate-workspace = { path = "../roamgate-workspace" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "test-util", "time"] }

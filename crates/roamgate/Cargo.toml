[package]
name = "roamgate"
description = "Roamgate's server: for now the skeleton the release targets are built, packaged and updated with"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "roamgate"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
roamgate-base = { path = "../roamgate-base" }
roamgate-sidecar = { path = "../roamgate-sidecar" }
serde_json = { version = "1", features = ["preserve_order"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "mime-guess"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "process", "time"] }

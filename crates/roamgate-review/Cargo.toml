[package]
name = "roamgate-review"
version = "0.0.0"
description = "Roamgate's review service (Rust migration plan, section 6.2): reviews and their threads in reviews.sqlite, anchors and reanchoring, delivery to agents, watch and handoff, permission prompts, images, and the agent socket's review texts"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fancy-regex = "0.17"
indexmap = { version = "2", features = ["serde"] }
jiff = "0.2"
rand = "0.9"
regex = "1"
roamgate-protocol = { path = "../roamgate-protocol" }
roamgate-base = { path = "../roamgate-base" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "fs", "io-util"] }

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

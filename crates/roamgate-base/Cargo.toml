[package]
name = "roamgate-base"
version = "0.0.0"
description = "Roamgate's server foundations: data paths, environment, private files, JSON and SQLite stores, the session lock, the clock, settings, errors, logs and caches"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Honour ROAMGATE_TEST_CLOCK in an optimised build too (debug builds always
# do): for the parity harness, never for a release.
test-clock = []

[dependencies]
base64 = "0.22"
fancy-regex = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
jiff = "0.2"
rand = "0.9"
regex = "1"
roamgate-protocol = { path = "../roamgate-protocol" }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

# Unix sockets on Windows (local_socket): tokio has no AF_UNIX there.
[target.'cfg(windows)'.dependencies]
async-io = "2"
futures-io = "0.3"
socket2 = "0.6"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tokio = { version = "1", features = ["full", "test-util"] }

[package]
name = "roamgate-agents"
version = "0.0.0"
description = "Roamgate's agent sessions (Rust migration plan, section 6.2): the transcript readers of the eight agents, the history projection, tasks, artifacts, commands, ATIF, token usage, compaction, tail reads, the history watch, seen marks, session resolution and the agent messenger"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fancy-regex = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
icu_collator = "2"
indexmap = "2"
jiff = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
regex = "1"
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
rusqlite = { version = "0.43", features = ["bundled"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tokio = { version = "1", features = ["full", "test-util"] }

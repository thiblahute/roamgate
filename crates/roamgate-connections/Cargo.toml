[package]
name = "roamgate-connections"
version = "0.0.0"
description = "Roamgate's connections (Rust migration plan, section 6.2): limit-resume and the usage-limit module, the connection manager, connections.json, SSH profile runtimes, network watch and the Herdr subscription loops"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
fancy-regex = "0.17"
hex = "0.4"
if-addrs = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
rand = "0.9"
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-herdr = { path = "../roamgate-herdr" }
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

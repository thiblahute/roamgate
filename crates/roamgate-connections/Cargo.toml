[package]
name = "roamgate-connections"
version = "0.0.0"
description = "Roamgate's connections (Rust migration plan, section 6.2): limit-resume and the usage-limit module, the connection manager, connections.json, SSH profile runtimes, network watch and the Herdr subscription loops"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
fancy-regex = "0.17"
hex = "0.4"
if-addrs = "0.13"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
jiff = "0.2"
rand = "0.9"
rusqlite = { version = "0.43", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
roamgate-base = { path = "../roamgate-base" }
roamgate-channel = { path = "../roamgate-channel" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-herdr = { path = "../roamgate-herdr" }
sha2 = "0.10"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net", "io-util", "process"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

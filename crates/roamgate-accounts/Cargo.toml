[package]
name = "roamgate-accounts"
version = "0.0.0"
description = "Roamgate's agent accounts: each account profile's own configuration directory, the environment its agent starts with, what it shares with the user's own configuration, and its sign-in state"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roamgate-base = { path = "../roamgate-base" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[package]
name = "roamgate-cli"
version = "0.0.0"
description = "Roamgate's command line: for now `roamgate update`, `roamgate rollback`, `roamgate herdr`, the update check and install served over HTTP, and the part of the service manager they use"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4"
rand = "0.9"
regex = "1"
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-herdr = { path = "../roamgate-herdr" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[package]
name = "roamgate-cli"
version = "0.0.0"
description = "Roamgate's command line: for now `roamgate update`, `roamgate rollback`, `roamgate herdr`, `roamgate voice`, `roamgate setup voice`, the update check and install served over HTTP, and the part of the service manager they use"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
if-addrs = "0.15"
rand = "0.9"
jiff = "0.2"
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roamgate-activity = { path = "../roamgate-activity" }
roamgate-archive = { path = "../roamgate-archive" }
roamgate-base = { path = "../roamgate-base" }
roamgate-connections = { path = "../roamgate-connections" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-herdr = { path = "../roamgate-herdr" }
roamgate-history = { path = "../roamgate-history" }
roamgate-mr-reviews = { path = "../roamgate-mr-reviews" }
roamgate-notify = { path = "../roamgate-notify" }
roamgate-voice-server = { path = "../roamgate-voice-server" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "signal", "sync", "time"] }
url = "2"
x509-parser = "0.17"

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", default-features = false }
rustix = { version = "1", features = ["param", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
roamgate-voice-server = { path = "../roamgate-voice-server", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }

[package]
name = "roamgate-history"
version = "0.0.0"
description = "Roamgate's local history (Rust migration plan, section 6.2; server/src/history): a git repository of what is authored in Roamgate (the Work board with a commit per change, reviews, settings without secrets, connections, the Reviews' state, companion and voice), written by passes off the event loop, its secret scan, status and runtime"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-mr-reviews = { path = "../roamgate-mr-reviews" }
roamgate-work = { path = "../roamgate-work" }
rusqlite = { version = "0.43", features = ["bundled"] }
rustix = { version = "1", features = ["process", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }

[package]
name = "roamgate-conversation"
version = "0.0.0"
description = "Roamgate's conversation mode (Rust migration plan, section 6.2): leases, handover, the holder protocol with old-holder compatibility, queue, steer and interrupt, rewind, `!` shell jobs, idle stop, stuck watch, resume state and delta coalescing, reaching each agent through its driver"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
roamgate-base = { path = "../roamgate-base" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
indexmap = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

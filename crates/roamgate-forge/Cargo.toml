[package]
name = "roamgate-forge"
version = "0.0.0"
description = "Roamgate's forge layer: the forge gate (glab and gh calls per minute, at once, Retry-After and ETag reuse), the MR cache of merge and pull request answers (mr-cache/state.json, the forge_cache pushes), and review's merge and pull requests (reads, drafts, chip statuses)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22"
futures-util = "0.3"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
roamgate-agents = { path = "../roamgate-agents" }
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
roamgate-git = { path = "../roamgate-git" }
roamgate-review = { path = "../roamgate-review" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tokio = { version = "1", features = ["full", "test-util"] }

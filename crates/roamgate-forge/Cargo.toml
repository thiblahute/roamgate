[package]
name = "roamgate-forge"
version = "0.0.0"
description = "Roamgate's forge layer: the forge gate (glab and gh calls per minute, at once, Retry-After and ETag reuse) and the MR cache of merge and pull request answers (mr-cache/state.json, the forge_cache pushes)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3"
regex = "1"
roamgate-base = { path = "../roamgate-base" }
roamgate-git = { path = "../roamgate-git" }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
roamgate-protocol = { path = "../roamgate-protocol", features = ["vectors"] }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

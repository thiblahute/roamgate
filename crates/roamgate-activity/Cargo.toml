[package]
name = "roamgate-activity"
version = "0.0.0"
description = "Roamgate's activity log: for now the time-report provider bridge (the Hours view's bridge.time_report); the recorder, reader and timeline follow in Phase 3"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jiff = "0.2"
regex = "1"
roamgate-base = { path = "../roamgate-base" }
roamgate-exec = { path = "../roamgate-exec" }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

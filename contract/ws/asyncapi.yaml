asyncapi: 3.0.0
info:
  title: Roamgate WebSockets
  version: "1"
  description: "The browser bridge /ws (its RPC and pushes are under contract/rpc and contract/push), the notification feed, the voice socket and a call's signalling."
channels:
  bridge:
    address: /ws
    description: "Hello with bridge_protocol_version 2 and capabilities; requests {id, method, params, connection_id?, connection_generation?, lane?}; replies {id, result} or {id, error: {message, code?}}, enveloped per connection; chunks marked with \\u0001 and {\"ack\": n} flow-control windows of 64 KiB to 8 MiB; per-message deflate from 1 KiB with a dedicated compressor; backpressure 8 and 64 MiB, a 30 s stall closes the socket; close 4001 on logout."
  notifications:
    address: /api/notifications/ws
    description: "The Android app's notification feed."
    messages:
      notifications_in_action:
        $ref: "#/components/messages/notifications_in_action"
      notifications_in_hello:
        $ref: "#/components/messages/notifications_in_hello"
      notifications_in_ping:
        $ref: "#/components/messages/notifications_in_ping"
      notifications_out_action:
        $ref: "#/components/messages/notifications_out_action"
      notifications_out_notification:
        $ref: "#/components/messages/notifications_out_notification"
      notifications_out_notification_clear:
        $ref: "#/components/messages/notifications_out_notification_clear"
      notifications_out_pong:
        $ref: "#/components/messages/notifications_out_pong"
      notifications_out_ready:
        $ref: "#/components/messages/notifications_out_ready"
  voice:
    address: /api/voice/ws
    description: "Listening, speech and calls."
    messages:
      voice_in_call_audio:
        $ref: "#/components/messages/voice_in_call_audio"
      voice_in_call_carry:
        $ref: "#/components/messages/voice_in_call_carry"

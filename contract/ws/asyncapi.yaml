asyncapi: 3.0.0
info:
  title: Roamgate WebSockets
  version: "1"
  description: "The browser bridge /ws (its RPC and pushes are under contract/rpc and contract/push), the notification feed, the voice socket and a call's signalling."
channels:
  bridge:
    address: /ws
    description: "Hello with bridge_protocol_version 2 and capabilities; requests {id, method, params, connection_id?, connection_generation?, lane?}; replies {id, result} or {id, error: {message, code?}}, enveloped per connection; chunks marked with \\u0001 and {\"ack\": n} flow-control windows of 64 KiB to 8 MiB; per-message deflate from 1 KiB with a dedicated compressor; backpressure 8 and 64 MiB, a 30 s stall closes the socket; close 4001 on logout."
  notifications:
    address: /api/notifications/ws
    description: "The Android app's notification feed."
    messages:
      notifications_in_action:
        $ref: "#/components/messages/notifications_in_action"
      notifications_in_hello:
        $ref: "#/components/messages/notifications_in_hello"
      notifications_in_ping:
        $ref: "#/components/messages/notifications_in_ping"
      notifications_out_action:
        $ref: "#/components/messages/notifications_out_action"
      notifications_out_notification:
        $ref: "#/components/messages/notifications_out_notification"
      notifications_out_notification_clear:
        $ref: "#/components/messages/notifications_out_notification_clear"
      notifications_out_pong:
        $ref: "#/components/messages/notifications_out_pong"
      notifications_out_ready:
        $ref: "#/components/messages/notifications_out_ready"
  voice:
    address: /api/voice/ws
    description: "Listening, speech and calls."
    messages:
      voice_in_call_audio:
        $ref: "#/components/messages/voice_in_call_audio"
      voice_in_call_carry:
        $ref: "#/components/messages/voice_in_call_carry"
      voice_in_call_carry_end:
        $ref: "#/components/messages/voice_in_call_carry_end"
      voice_in_call_handoff:
        $ref: "#/components/messages/voice_in_call_handoff"
      voice_in_call_hush:
        $ref: "#/components/messages/voice_in_call_hush"
      voice_in_call_ice:
        $ref: "#/components/messages/voice_in_call_ice"
      voice_in_call_microphone:
        $ref: "#/components/messages/voice_in_call_microphone"
      voice_in_call_mute:
        $ref: "#/components/messages/voice_in_call_mute"
      voice_in_call_mute_state:
        $ref: "#/components/messages/voice_in_call_mute_state"
      voice_in_call_output:
        $ref: "#/components/messages/voice_in_call_output"
      voice_in_call_output_state:
        $ref: "#/components/messages/voice_in_call_output_state"
      voice_in_call_resume:
        $ref: "#/components/messages/voice_in_call_resume"
      voice_in_finish:
        $ref: "#/components/messages/voice_in_finish"
      voice_in_listen:
        $ref: "#/components/messages/voice_in_listen"
      voice_in_release:
        $ref: "#/components/messages/voice_in_release"
      voice_in_resume:
        $ref: "#/components/messages/voice_in_resume"
      voice_in_stop:
        $ref: "#/components/messages/voice_in_stop"
      voice_in_warm:
        $ref: "#/components/messages/voice_in_warm"
      voice_out_call_audio:
        $ref: "#/components/messages/voice_out_call_audio"
      voice_out_call_carrier:
        $ref: "#/components/messages/voice_out_call_carrier"
      voice_out_call_carry:
        $ref: "#/components/messages/voice_out_call_carry"
      voice_out_call_error:
        $ref: "#/components/messages/voice_out_call_error"
      voice_out_call_handoff:
        $ref: "#/components/messages/voice_out_call_handoff"
      voice_out_call_microphone:
        $ref: "#/components/messages/voice_out_call_microphone"
      voice_out_call_music:
        $ref: "#/components/messages/voice_out_call_music"
      voice_out_call_mute:
        $ref: "#/components/messages/voice_out_call_mute"
      voice_out_call_output:
        $ref: "#/components/messages/voice_out_call_output"
      voice_out_call_output_state:
        $ref: "#/components/messages/voice_out_call_output_state"
      voice_out_call_replies_peer:
        $ref: "#/components/messages/voice_out_call_replies_peer"
      voice_out_call_restarted:
        $ref: "#/components/messages/voice_out_call_restarted"
      voice_out_error:
        $ref: "#/components/messages/voice_out_error"
      voice_out_final:
        $ref: "#/components/messages/voice_out_final"
      voice_out_listening:
        $ref: "#/components/messages/voice_out_listening"
      voice_out_loading:
        $ref: "#/components/messages/voice_out_loading"
      voice_out_partial:
        $ref: "#/components/messages/voice_out_partial"
      voice_out_ready:
        $ref: "#/components/messages/voice_out_ready"
      voice_out_resume_failed:
        $ref: "#/components/messages/voice_out_resume_failed"
      voice_out_resumed:
        $ref: "#/components/messages/voice_out_resumed"
      voice_out_speech_start:
        $ref: "#/components/messages/voice_out_speech_start"
      voice_out_stalled:
        $ref: "#/components/messages/voice_out_stalled"
      voice_out_warm:
        $ref: "#/components/messages/voice_out_warm"
  signalling:
    address: /api/voice/call/signalling
    description: "A call's WebRTC signalling: relayed between the page and the voice helper's signalling server, which the server also reads."
    messages:
      signalling_upstream_list:
        $ref: "#/components/messages/signalling_upstream_list"
      signalling_upstream_peerStatusChanged:
        $ref: "#/components/messages/signalling_upstream_peerStatusChanged"
      signalling_upstream_welcome:
        $ref: "#/components/messages/signalling_upstream_welcome"

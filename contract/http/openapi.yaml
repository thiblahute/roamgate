openapi: 3.1.0
info:
  title: Roamgate HTTP routes
  version: "1"
  description: "Every path of the listener, from scripts/contract/inventory.ts. Authentication: every route but /health, /healthz, the login routes, /login, the icon, the call handoff and /rendered/* requires the session cookie (or a loopback development listener). WebSocket routes are documented in contract/ws/asyncapi.yaml."
paths:
  /api/agent-session/atif:
    get:
      summary: /api/agent-session/atif
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/agent-session/download:
    get:
      summary: /api/agent-session/download
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/agent-session/atif":
    get:
      summary: "/api/connections/{connection_id}/agent-session/atif"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/agent-session/download":
    get:
      summary: "/api/connections/{connection_id}/agent-session/download"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/file/delete":
    post:
      summary: "/api/connections/{connection_id}/file/delete"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/file/download":
    get:
      summary: "/api/connections/{connection_id}/file/download"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/file/upload":
    post:
      summary: "/api/connections/{connection_id}/file/upload"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/herdr-info":
    get:
      summary: A connection's Herdr version and protocol
      x-status: typed
      responses:
        "200":
          description: What Herdr's ping says.
          content:
            application/json:
              schema:
                type: object
                required: [version, protocol]
                properties:
                  version: { type: string }
                  protocol: { type: integer, minimum: 1 }
                additionalProperties: false
        "4XX": { description: "Not logged in, or no such connection." }
        "5XX":
          description: Herdr unreachable or invalid (503), or a Windows host (501).
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [error],
                  properties: { error: { type: string } },
                  additionalProperties: false,
                }
  "/api/connections/{connection_id}/terminal-upload":
    post:
      summary: "/api/connections/{connection_id}/terminal-upload"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  "/api/connections/{connection_id}/upload-image":
    post:
      summary: "/api/connections/{connection_id}/upload-image"
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/file/delete:
    post:
      summary: /api/file/delete
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/file/download:
    get:
      summary: /api/file/download
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/file/upload:
    post:
      summary: /api/file/upload
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/health:
    get:
      summary: /api/health
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/herdr-info:
    get:
      summary: The default connection's Herdr version and protocol
      x-status: typed
      responses:
        "200": &herdrInfo
          description: What Herdr's ping says.
          content:
            application/json:
              schema:
                type: object
                required: [version, protocol]
                properties:
                  version: { type: string }
                  protocol: { type: integer, minimum: 1 }
                additionalProperties: false
        "4XX": { description: Not logged in. }
        "5XX": &herdrError
          description: Herdr unreachable or invalid (503).
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [error],
                  properties: { error: { type: string } },
                  additionalProperties: false,
                }
  /api/herdr/setup:
    post:
      summary: "Installs (when missing) and starts the local Herdr as a user service; needs x-roamgate-herdr-setup: 1"
      x-status: typed
      responses:
        "200":
          description: Herdr answers.
          content:
            application/json:
              schema:
                type: object
                required: [ok, outcome, version, protocol]
                properties:
                  ok: { const: true }
                  outcome: { enum: [already-running, started, installed] }
                  version: { type: string }
                  protocol: { type: integer }
                  binary_path:
                    { type: string, description: absent when already running }
                additionalProperties: false
        "4XX": &setupError
          description: 403 without the confirmation header, 409 while a setup runs, 401 not logged in.
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [error],
                  properties: { error: { type: string } },
                  additionalProperties: false,
                }
        "5XX": *setupError
  /api/herdr/status:
    get:
      summary: The local Herdr's state and whether managed setup is possible
      x-status: typed
      responses:
        "200":
          description: running (version, protocol), installed (binary_path) or missing.
          content:
            application/json:
              schema:
                type: object
                required: [state, can_setup, verified_version]
                properties:
                  state: { enum: [running, installed, missing] }
                  version: { type: string }
                  protocol: { type: integer }
                  binary_path: { type: string }
                  can_setup: { type: boolean }
                  verified_version: { type: string }
                additionalProperties: false
        "4XX": { description: Not logged in. }
        "5XX":
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [error],
                  properties: { error: { type: string } },
                  additionalProperties: false,
                }
          description: The guard or the detection failed.
  /api/history:
    get:
      summary: /api/history
      x-status: inventoried
      responses:
        default:
          description: See the handler.
    put:
      summary: /api/history
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/history/commit:
    post:
      summary: /api/history/commit
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/instance-settings:
    get:
      summary: /api/instance-settings
      x-status: inventoried
      responses:
        default:
          description: See the handler.
    put:
      summary: /api/instance-settings
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/login:
    post:
      summary: /api/login
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/login/pin:
    post:
      summary: /api/login/pin
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/logout:
    post:
      summary: /api/logout
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/notifications/push:
    get:
      summary: The Web Push state, VAPID public key
      x-status: typed
      responses:
        "200":
          description: Whether Web Push is available, and the key browsers subscribe with.
          content:
            application/json:
              schema:
                type: object
                required: [available, publicKey]
                properties:
                  available: { type: boolean }
                  publicKey: { type: ["string", "null"] }
                additionalProperties: false
        "401": { description: Not logged in. }
    post:
      summary: Registers (or replaces) a device's push subscription; needs x-roamgate-push 1, same site, JSON
      x-status: typed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [subscription, preferences]
              properties:
                subscription:
                  type: object
                  required: [endpoint, keys]
                  properties:
                    endpoint:
                      {
                        type: string,
                        description: "https on an allow-listed push provider host",
                      }
                    keys:
                      type: object
                      required: [p256dh, auth]
                      properties:
                        p256dh: { type: string }
                        auth: { type: string }
                preferences:
                  type: object
                  required: [completed, blocked]
                  properties:
                    completed: { type: boolean }
                    blocked: { type: boolean }
                    quietWithAndroidApp: { type: boolean }
      responses:
        "200": &pushOk
          description: Saved.
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [ok],
                  properties: { ok: { const: true } },
                  additionalProperties: false,
                }
        "403": &pushForbidden
          description: Without the header, JSON, or from another site
          content:
            text/plain:
              schema: { const: Forbidden }
        "4XX": &pushError
          description: "400 invalid, 401 not logged in, 409 too many devices"
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [error],
                  properties: { error: { type: string } },
                  additionalProperties: false,
                }
        "5XX": *pushError
    delete:
      summary: Removes a device by endpoint; needs x-roamgate-push 1, same site, JSON
      x-status: typed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string }
      responses:
        "200": *pushOk
        "403": *pushForbidden
        "4XX": *pushError
        "5XX": *pushError
  /api/notifications/ws:
    get:
      summary: WebSocket upgrade (see contract/ws/asyncapi.yaml)
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/review/image:
    get:
      summary: /api/review/image
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/terminal-upload:
    post:
      summary: /api/terminal-upload
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/update/check:
    get:
      summary: "The latest release on the update mirror; needs x-roamgate-update: 1 (or x-herdr-gui-update)"
      x-status: typed
      responses:
        "200":
          description: The current and latest versions; latest_version is absent when checks are disabled or the platform has no package.
          content:
            application/json:
              schema:
                type: object
                required:
                  [current_version, update_available, can_auto_update, platform]
                properties:
                  current_version: { type: string }
                  latest_version: { type: string }
                  update_available: { type: boolean }
                  can_auto_update: { type: boolean }
                  reason: { type: string }
                  platform: { type: string }
                  source_url: { type: string }
                  metadata_url: { type: string }
                additionalProperties: false
        "4XX": &updateError
          description: 403 without the confirmation header, 401 not logged in.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  current_version: { type: string }
                  source_url: { type: string }
                  metadata_url: { type: string }
                additionalProperties: false
        "5XX": *updateError
  /api/update/install:
    post:
      summary: "Installs the latest release over the standalone binary and restarts under its supervisor; needs x-roamgate-update: 1"
      x-status: typed
      responses:
        "2XX":
          description: Installed; the process exits so the supervisor restarts it.
        "4XX": &installError
          description: 403 without the confirmation header, 409 not possible here or already running, 401 not logged in.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  current_version: { type: string }
                  source_url: { type: string }
                  metadata_url: { type: string }
        "5XX": *installError
  /api/upload-image:
    post:
      summary: /api/upload-image
      x-status: inventoried
      responses:
        default:
          description: See the handler.
  /api/voice:
    get:
      summary: "The voice chat's state: available or why not, the companion, reading speed, longest pause"
      x-status: typed
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "properties":
                            {
                              "available": { "type": "boolean" },
                              "detail": { "type": "string" },
                              "route": { "type": "boolean" },
                              "front": { "type": "boolean" },
                              "front_mode": { "enum": ["companion", "relay"] },
                              "companion_epoch": { "type": "integer" },
                              "speech_rate": { "type": "number" },
                              "max_pause_ms": { "type": "integer" },
                              "surprise": { "type": "boolean" },
                              "low_gpu": { "type": "string" },
                              "debug": { "type": "boolean" },
                            },
                          "required":
                            ["available", "speech_rate", "max_pause_ms"],
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/answers:
    get:
      summary: "The jobs' answers nobody heard yet (voice header); ?job= one, whole"
      x-status: typed
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "oneOf":
                            [
                              {
                                "type": "object",
                                "properties":
                                  {
                                    "answers":
                                      {
                                        "type": "array",
                                        "items":
                                          {
                                            "type": "object",
                                            "properties":
                                              {
                                                "job": { "type": "string" },
                                                "label": { "type": "string" },
                                                "question":
                                                  { "type": "string" },
                                                "at": { "type": "integer" },
                                                "mentioned":
                                                  { "type": "boolean" },
                                                "chars": { "type": "integer" },
                                              },
                                            "required":
                                              [
                                                "job",
                                                "label",
                                                "question",
                                                "at",
                                                "mentioned",
                                                "chars",
                                              ],
                                            "additionalProperties": false,
                                          },
                                      },
                                  },
                                "required": ["answers"],
                                "additionalProperties": false,
                              },
                              {
                                "type": "object",
                                "properties":
                                  {
                                    "job": { "type": "string" },
                                    "pane": { "type": "string" },
                                    "label": { "type": "string" },
                                    "question": { "type": "string" },
                                    "answer": { "type": "string" },
                                    "at": { "type": "integer" },
                                    "mentioned": { "type": "boolean" },
                                  },
                                "required": ["job", "answer"],
                                "additionalProperties": false,
                              },
                            ],
                        },
                    },
                },
            },
          "4XX":
            {
              "description": "Refused: not logged in (401, no body), no voice header (403), a bad request (400), unknown (404), a conflict (409).",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "5XX":
            {
              "description": "The helper or the configuration failed.",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/answers/heard:
    post:
      summary: "An answer heard: dropped (voice header)"
      x-status: typed
      requestBody:
        {
          "content":
            {
              "application/json":
                {
                  "schema":
                    {
                      "type": "object",
                      "properties": { "job": { "type": "string" } },
                      "additionalProperties": false,
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "properties": { "heard": { "type": "string" } },
                          "required": ["heard"],
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "4XX":
            {
              "description": "Refused: not logged in (401, no body), no voice header (403), a bad request (400), unknown (404), a conflict (409).",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "5XX":
            {
              "description": "The helper or the configuration failed.",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/answers/mentioned:
    post:
      summary: "Answers mentioned in a call (voice header)"
      x-status: typed
      requestBody:
        {
          "content":
            {
              "application/json":
                {
                  "schema":
                    {
                      "type": "object",
                      "properties":
                        {
                          "jobs":
                            { "type": "array", "items": { "type": "string" } },
                        },
                      "additionalProperties": false,
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "properties": { "mentioned": { "type": "integer" } },
                          "required": ["mentioned"],
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "4XX":
            {
              "description": "Refused: not logged in (401, no body), no voice header (403), a bad request (400), unknown (404), a conflict (409).",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "5XX":
            {
              "description": "The helper or the configuration failed.",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/call/handoff:
    post:
      summary: "Redeems a call's handoff token for its carrier token, without login (the Android app)"
      x-status: typed
      requestBody:
        {
          "content":
            {
              "application/json":
                {
                  "schema":
                    {
                      "type": "object",
                      "properties": { "handoff": {} },
                      "additionalProperties": false,
                    },
                },
            },
        }
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "properties":
                            {
                              "call": { "type": "integer" },
                              "carrier": { "type": "string" },
                            },
                          "required": ["call", "carrier"],
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "4XX":
            {
              "description": "Refused (403), bad request (400), unknown, used or expired (410), too many attempts (429).",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/call/signalling:
    get:
      summary: "A call's signalling WebSocket, for its page or carrying app: ?call=&call_token= (see contract/ws/asyncapi.yaml)"
      x-status: typed
      responses:
        {
          "101":
            { "description": "Relayed to the helper's signalling server." },
          "4XX":
            {
              "description": "Not logged in (401), or not the call's owner (403).",
            },
        }
  /api/voice/companion/reset:
    post:
      summary: "The companion forgets everything (voice header): its new epoch"
      x-status: typed
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "properties": { "epoch": { "type": "integer" } },
                          "required": ["epoch"],
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "4XX":
            {
              "description": "Refused: not logged in (401, no body), no voice header (403), a bad request (400), unknown (404), a conflict (409).",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "5XX":
            {
              "description": "The helper or the configuration failed.",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/errand:
    get:
      summary: "A companion job on a session, ?job="
      x-status: typed
      responses:
        {
          "200":
            {
              "description": "OK",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "properties":
                            {
                              "done": { "type": "boolean" },
                              "answer": { "type": ["string", "null"] },
                              "notice": { "type": ["object", "null"] },
                            },
                          "required": ["done", "answer"],
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "4XX":
            {
              "description": "Refused: not logged in (401, no body), no voice header (403), a bad request (400), unknown (404), a conflict (409).",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
          "5XX":
            {
              "description": "The helper or the configuration failed.",
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "type": "object",
                          "required": ["error"],
                          "properties": { "error": { "type": "string" } },
                          "additionalProperties": false,
                        },
                    },
                },
            },
        }
  /api/voice/event:
    post:
      summary: "Something that happened, told to the companion: what it says of it (empty without a front or the header)"
      x-status: typed
      requestBody:
        {
          "content":
            {
              "application/json":
                {
                  "schema":
                    {
                      "type": "object",
                      "properties":
                        {
                          "event": { "type": "string" },
                          "kind": { "enum": ["event", "answer", "progress"] },
                          "agent": { "type": "string" },
                          "current": { "type": "string" },
                          "sessions": { "type": "array" },
                          "context": {},
                        },
                    },
                },
            },
        }
      responses:
        {

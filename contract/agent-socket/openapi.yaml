openapi: 3.1.0
info:
  title: Roamgate agent socket
  version: "1"
  description: "HTTP over the per-connection unix socket (0600 in a 0700 directory) that agents, the roamgate-review client, the holder and the Claude mod call. Every command is POST /v1/<command> with an application/x-www-form-urlencoded body, at most 1 MiB (hold_output: 64 MiB); replies are JSON, {error} with 400, 404, 413 or 500 on failure. watch and hold are long polls without a server timeout."
paths:
  /v1/add:
    post:
      summary: add
      x-status: inventoried
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "200":
          description: "The command's JSON reply."
          content:
            application/json:
              schema: {}

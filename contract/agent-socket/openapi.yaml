openapi: 3.1.0
info:
  title: Roamgate agent socket
  version: "1"
  description:
    "HTTP over the per-connection unix socket (0600 in a 0700 directory) that agents, the roamgate-review
    client, the holder and the Claude mod call. Every command is POST /v1/<command> with a flat JSON body
    (agent-server.ts formOf reads each value as a string), at most 1 MiB (hold_output: 64 MiB); replies
    are JSON, {error} with 400, 404, 409, 413, 429, 500 or 503 on failure. watch, hold, mod_poll, permission
    and questions are long polls without a server timeout."

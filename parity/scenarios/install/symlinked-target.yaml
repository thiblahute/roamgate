name: a symlinked install target is not replaced
ledger:
  - "scripts/install-roamgate.test.ts > refuses to replace a symlinked install target"
family: install
tier: T2
description: >
  The release installer (scripts/install-roamgate.sh, or the legacy
  install-herdr-gui.sh) run with real curl and tar against a release served
  by fake-models (fixture.sh makes it), into an install directory under the
  run's root.
# The POSIX installers (scripts/install-*.sh); Windows installs with
# install-plugin.ps1 (plugin-windows.yaml).
platforms: [linux, macos]
server:
  herdr: false
  start: false
steps:
  - sh: sh "${REPO}/parity/scenarios/install/fixture.sh" roamgate
  - sh: mkdir -p install && printf 'outside\n' > outside-binary && chmod 755 outside-binary && ln -s ../outside-binary install/roamgate
  - sh: sh "${REPO}/scripts/install-roamgate.sh"
    env:
      HERDR_GUI_RELEASE_BASE_URL: "${FAKE_HTTP}/files/releases"
      HERDR_GUI_INSTALL_DIR: "${ROOT}/install"
    expect:
      {
        exit_not: 0,
        stderr_contains: install target exists but is not a regular file,
      }
  - assert_file: { path: "${ROOT}/outside-binary", text: "outside\n" }

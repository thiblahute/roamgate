name: the installer installs roamgate-pi beside roamgate and keeps the previous one
ledger:
  - "scripts/install-roamgate.test.ts > installs roamgate-pi beside roamgate and keeps the previous one"
family: install
tier: T2
description: >
  The release installer (scripts/install-roamgate.sh) run with real curl and
  tar against a release with the Pi sidecar served by fake-models (fixture.sh
  makes it), into an install directory under the run's root that has an
  older roamgate and roamgate-pi.
# The POSIX installers (scripts/install-*.sh); Windows installs with
# install-plugin.ps1 (plugin-windows.yaml).
platforms: [linux, macos]
server:
  herdr: false
  start: false
steps:
  - sh: sh "${REPO}/parity/scenarios/install/fixture.sh" roamgate
    env: { PI_SIDECAR: "1" }
  - sh: mkdir -p install && printf 'previous binary\n' > install/roamgate && printf 'previous pi\n' > install/roamgate-pi
  - sh: sh "${REPO}/scripts/install-roamgate.sh"
    env:
      ROAMGATE_RELEASE_BASE_URL: "${FAKE_HTTP}/files/releases"
      ROAMGATE_INSTALL_DIR: "${ROOT}/install"
    expect: { exit: 0, stderr: "" }
  - sh: ./install/roamgate-pi
    expect: { exit: 0, stdout: "pi 9.8.7\n" }
  - assert_file:
      { path: "${ROOT}/install/roamgate-pi.previous", text: "previous pi\n" }
  - assert_file:
      { path: "${ROOT}/install/roamgate.previous", text: "previous binary\n" }

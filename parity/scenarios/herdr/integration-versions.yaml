name:
  Herdr's integration list gets the installed and available versions from Herdr's CLI, only when they
  agree
family: integration
description:
  "integration.list passes Herdr's list through, filling a current or outdated integration's
  missing versions from `herdr integration status` (fake herdr CLI) when `herdr --version` is the running
  Herdr's (its ping): Herdr's own values win, unknown, malformed, duplicated or inconsistent records
  add nothing, a complete or uninstalled list never runs the CLI, and a failing or mismatched CLI leaves
  the list as Herdr gave it."
server:
  herdr:
    version: 1.2.3
    workspaces:
      - workspace_id: w1
steps:
  - login: {}
  - connect: {}
  - set:
      case: supplements
  - write:
      path: ${ROOT}/fakes/herdr.json
      json:
        rules:
          - args:
              - --version
            stdout: "herdr 1.2.3

              "
            exit: 0
          - args:
              - integration
              - status
            stdout:
              "sample-agent: current (v3) (/tmp/integration-test/path (copy)/hook.sh)\r\nother: outdated\
              \ (v1 < v4) (C:\\integration-test\\hook.ps1)\r\nextra: current (v7)\r\nletta (experimental):\
              \ current (v8)"
            exit: 0
  - herdr_seed:
      version: 1.2.3
      workspaces:
        - workspace_id: w1
      responses:
        integration.list:
          type: integration_list
          integrations:
            - &id001
              target: sample_agent
              label: Sample Agent
              command: sample
              available: true
              state: current
            - target: other
              label: Sample Agent
              command: sample
              available: true
              state: outdated
  - call: integration.list
    reply:
      integrations:
        - target: sample_agent
          label: Sample Agent
          command: sample
          available: true
          state: current
          installed_version: 3
          $exact: true
        - target: other
          label: Sample Agent
          command: sample
          available: true
          state: outdated
          installed_version: 1
          available_version: 4
          $exact: true
      type: integration_list
      $exact: true

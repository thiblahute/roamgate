name: an SSH connection's integration versions come from its own host's Herdr CLI, never the local one
family: integration
description: >
  On an SSH profile, the missing versions are read with one SSH command on
  that host (fake-ssh runs it in the fake remote home), batch mode and
  strict host keys, `"$bin" --version && "$bin" integration status`; the
  local herdr CLI is never asked. An SSH failure or a version that is not
  the host's Herdr keeps Herdr's list.
# Its SSH host is this machine playing a POSIX host (the fake ssh runs its
# commands here, its paths are the run's), which Windows is not.
platforms: [linux, macos]
server:
  herdr: false
  herdrs:
    remote:
      version: 1.2.3
      workspaces: [{ workspace_id: w1 }]
      responses:
        integration.list:
          {
            type: integration_list,
            integrations:
              [
                {
                  target: sample_agent,
                  label: Sample Agent,
                  command: sample,
                  available: true,
                  state: outdated,
                },
              ],
          }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ALLOW_SSH: "1"
  fakes:
    herdr:
      rules:
        - { args: [--version], stdout: "herdr 1.2.3\n" }
        - {
            args: [integration, status],
            stdout: "sample-agent: outdated (v2 < v4)\n",
          }
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 2
        default_connection_id: remote
        profiles:
          - {
              id: remote,
              label: REMOTE,
              type: ssh,
              ssh_destination: alpha.example.test,
              remote_control_socket_path: "${HERDR_remote_CONTROL}",
              remote_client_socket_path: "${HERDR_remote_CLIENT}",
              auto_connect: true,
            }
steps:
  - login: {}
  - connect: {}
  - call: connections.connect
    id: up
    no_wait: true
    params: { id: remote }
  - await: up
    advance_every: 50
    reply: { state: ready, type: ssh }
  - call: integration.list
    connection_id: remote
    reply:
      {
        integrations:
          [
            {
              target: sample_agent,
              state: outdated,
              installed_version: 2,
              available_version: 4,
            },
          ],
      }
  - fake_calls:
      program: ssh
      argv_match: "BatchMode=yes.*StrictHostKeyChecking=yes.* -- alpha.example.test .*integration status"
      min: 1
  # The CLI ran on the host (the fake remote home), never in the server's place.
  - fake_calls:
      {
        program: herdr,
        argv_match: "^integration status$",
        calls: { $contains: [{ cwd: "${ROOT}/remote-home" }] },
      }
  - sh: 'python3 -c "import json,sys; sys.exit(1 if any(json.loads(l)[''program'']==''herdr'' and json.loads(l)[''cwd'']!=sys.argv[2] for l in open(sys.argv[1])) else 0)" ${ROOT}/fakes/calls.jsonl ${ROOT}/remote-home'
  # A version that is not the host's Herdr: the list as Herdr gave it.
  - write:
      path: "${ROOT}/fakes/herdr.json"
      json:
        {
          rules:
            [
              { args: [--version], stdout: "herdr 9.9.9\n" },
              {
                args: [integration, status],
                stdout: "sample-agent: outdated (v1 < v4)\n",
              },
            ],
        }
  - call: integration.list
    connection_id: remote
    reply:
      {
        integrations:
          [
            {
              target: sample_agent,
              state: outdated,
              installed_version: "{{absent}}",
              available_version: "{{absent}}",
            },
          ],
      }

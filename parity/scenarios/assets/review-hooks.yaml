name:
  the installed roamgate-review answers Claude Code's hooks and tells Roamgate of a claude started
  by hand
family: conversation
description:
  "The roamgate-review the server installs, run as Claude Code runs its hooks, against scripted
  agent sockets: a permission or a question answered or dismissed, stepping aside in a headless run, and
  the SessionStart hook that tells Roamgate of a claude started in a pane (a fake ps stands for the process
  tree)."
ledger:
  - server/src/conversation/holder-script.test.ts > answer in an ordinary pane
  - server/src/conversation/holder-script.test.ts > a dismissed permission or question denies it, saying
    the user dismissed it
  - server/src/conversation/holder-script.test.ts > step aside when ROAMGATE_HEADLESS=1
  - server/src/conversation/holder-script.test.ts > tells Roamgate of a claude started by hand, printing
    nothing
  - "server/src/conversation/holder-script.test.ts > steps aside: told to stay, headless, print mode, /clear,
    a subagent, no pane"
  - server/src/conversation/holder-script.test.ts > a resumed claude counts; Roamgate unreachable changes
    nothing
server:
  herdr: false
  files:
    ${ROOT}/ps-plain/ps:
      text:
        "#!/bin/sh\ncase \"$*\" in\n  *\"-p 4242\"*) echo \"  1 claude --model haiku\" ;;\n  *) echo\
        \ \"  4242 /bin/sh -c ~/.cache/roamgate/bin/roamgate-review claude-start\" ;;\nesac\n"
      mode: "0755"
    ${ROOT}/ps-none/ps:
      text:
        "#!/bin/sh\ncase \"$*\" in\n  *\"-p 4242\"*) echo \"  1 claude \" ;;\n  *) echo \"  4242 /bin/sh\
        \ -c ~/.cache/roamgate/bin/roamgate-review claude-start\" ;;\nesac\n"
      mode: "0755"
    ${ROOT}/ps-print-p/ps:
      text:
        "#!/bin/sh\ncase \"$*\" in\n  *\"-p 4242\"*) echo \"  1 claude -p hello\" ;;\n  *) echo \"\
        \  4242 /bin/sh -c ~/.cache/roamgate/bin/roamgate-review claude-start\" ;;\nesac\n"
      mode: "0755"
    ${ROOT}/ps-print/ps:
      text:
        "#!/bin/sh\ncase \"$*\" in\n  *\"-p 4242\"*) echo \"  1 claude --print\" ;;\n  *) echo \"\
        \  4242 /bin/sh -c ~/.cache/roamgate/bin/roamgate-review claude-start\" ;;\nesac\n"
      mode: "0755"
    ${ROOT}/ps-resume/ps:
      text:
        "#!/bin/sh\ncase \"$*\" in\n  *\"-p 4242\"*) echo \"  1 claude --resume x\" ;;\n  *) echo\
        \ \"  4242 /bin/sh -c ~/.cache/roamgate/bin/roamgate-review claude-start\" ;;\nesac\n"
      mode: "0755"
steps:
  - wait_file: .cache/roamgate/bin/roamgate-review
  - serve_agent_socket: allow
    replies:
      "*":
        answer: allow
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${allow_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review permission
    stdin: '{"hook_event_name": "PermissionRequest", "tool_name": "Bash", "tool_input": {"command": "ls"}}'
    expect:
      exit: 0
      stdout_json:
        hookSpecificOutput:
          decision:
            behavior: allow
            $exact: true
  - serve_agent_socket: dismiss
    replies:
      "*":
        answer: dismiss
        answers: null
        dismissed: true
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${dismiss_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review permission
    stdin: '{"hook_event_name": "PermissionRequest", "tool_name": "Bash", "tool_input": {"command": "ls"}}'
    expect:
      exit: 0
      stdout_json:
        hookSpecificOutput:
          decision:
            behavior: deny
            message: The user dismissed this request without answering.
            $exact: true
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${dismiss_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review questions
    stdin: '{"tool_input": {"questions": [{"question": "Q?"}]}}'
    expect:
      exit: 0
      stdout_json:
        hookSpecificOutput:
          hookEventName: PreToolUse
          permissionDecision: deny
          permissionDecisionReason: The user dismissed this question without answering.
          $exact: true
  - serve_agent_socket: headless
    replies:
      "*":
        answer: allow
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${headless_socket}
      ROAMGATE_HEADLESS=1 python3 ${HOME}/.cache/roamgate/bin/roamgate-review permission
    stdin: '{"hook_event_name": "PermissionRequest", "tool_name": "Bash", "tool_input": {"command": "ls"}}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${headless_socket}
      ROAMGATE_HEADLESS=1 python3 ${HOME}/.cache/roamgate/bin/roamgate-review questions
    stdin: '{"tool_input": {"questions": [{"question": "Q?"}]}}'
    expect:
      exit: 0
      stdout: ""
  - agent_socket_requests:
      name: headless
      count: 0
  - serve_agent_socket: start
    replies:
      "*":
        action: conversation
  - sh:
      env -i PATH=${ROOT}/ps-plain:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 HERDR_SOCKET_PATH=/tmp/herdr.sock
      ROAMGATE_REVIEW_SOCKET=${start_socket} python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin:
      '{"hook_event_name": "SessionStart", "source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000",
      "cwd": "/tmp"}'
    expect:
      exit: 0
      stdout: ""
  - agent_socket_requests:
      name: start
      calls:
        - command: claude_start
          body:
            pane: w1:p1
            herdr_socket: /tmp/herdr.sock
            session: 44444444-aaaa-bbbb-cccc-000000000000
            source: startup
            pid: "4242"
  - serve_agent_socket: aside
    replies:
      "*": {}
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${aside_socket}
      ROAMGATE_CLAUDE_START=terminal python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin:
      '{"hook_event_name": "SessionStart", "source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000",
      "cwd": "/tmp"}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${aside_socket}
      ROAMGATE_HEADLESS=1 python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin:
      '{"hook_event_name": "SessionStart", "source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000",
      "cwd": "/tmp"}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-print-p:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${aside_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin:
      '{"hook_event_name": "SessionStart", "source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000",
      "cwd": "/tmp"}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-print:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${aside_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin:
      '{"hook_event_name": "SessionStart", "source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000",
      "cwd": "/tmp"}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${aside_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin: '{"source": "clear", "session_id": "44444444-aaaa-bbbb-cccc-000000000000"}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${aside_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin: '{"source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000", "agent_id": "a1"}'
    expect:
      exit: 0
      stdout: ""
  - sh:
      env -i PATH=${ROOT}/ps-none:/usr/bin:/bin HOME=${HOME} ROAMGATE_REVIEW_SOCKET=${aside_socket} python3
      ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin:
      '{"hook_event_name": "SessionStart", "source": "startup", "session_id": "44444444-aaaa-bbbb-cccc-000000000000",
      "cwd": "/tmp"}'
    expect:
      exit: 0
      stdout: ""
  - agent_socket_requests:
      name: aside
      count: 0
  - serve_agent_socket: resumed
    replies:
      "*": {}
  - sh:
      env -i PATH=${ROOT}/ps-resume:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${resumed_socket}
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin: '{"source": "resume", "session_id": "44444444-aaaa-bbbb-cccc-000000000000"}'
    expect:
      exit: 0
  - agent_socket_requests:
      name: resumed
      calls:
        - command: claude_start
          body:
            source: resume
  - sh:
      env -i PATH=${ROOT}/ps-resume:/usr/bin:/bin HOME=${HOME} HERDR_PANE_ID=w1:p1 ROAMGATE_REVIEW_SOCKET=${ROOT}/none.sock
      python3 ${HOME}/.cache/roamgate/bin/roamgate-review claude-start
    stdin: '{"source": "resume", "session_id": "44444444-aaaa-bbbb-cccc-000000000000"}'
    expect:
      exit: 0
      stdout: ""

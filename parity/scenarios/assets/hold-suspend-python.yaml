name:
  the Python pane holder SSH hosts run, as a shell job, stops at Ctrl+Z and fg brings it back, as the
  installed one does
family: conversation
description:
  "The Python roamgate-hold (contract/assets/python, what SSH hosts get) runs as a job of an interactive bash in a terminal (a pty),
  against a scripted agent socket: told to suspend, it stops as a job, keeps the session, and fg asks
  Roamgate to bring it back to conversation mode with a new log, then resumes as told."
server:
  herdr: false
  files:
    .claude/projects/elsewhere/11111111-aaaa-bbbb-cccc-000000000000.jsonl: "{}

      "
    ${ROOT}/hbin/claude:
      text: '#!/bin/sh

        echo "claude $* ran"

        '
      mode: "0755"
    ${ROOT}/hbin/ps:
      text: "#!/bin/sh

        echo '  1 /sbin/init'

        "
      mode: "0755"
    ${ROOT}/driver.py:
      "import json, os, pty, select, sys, time\nlines = json.loads(sys.argv[1])\npid,\
      \ fd = pty.fork()\nif pid == 0:\n    os.environ[\"PS1\"] = \"$ \"\n    os.execvp(\"bash\", [\"bash\"\
      , \"--norc\", \"--noprofile\", \"-i\"])\ndef read(until, seconds):\n    out = b\"\"\n    end = time.time()\
      \ + seconds\n    while time.time() < end:\n        ready, _, _ = select.select([fd], [], [], 0.05)\n\
      \        if ready:\n            try:\n                out += os.read(fd, 65536)\n            except\
      \ OSError:\n                break\n            if until and until.encode() in out:\n           \
      \     until = None\n                end = min(end, time.time() + 0.5)\n    return out.decode(\"\
      utf-8\", \"replace\")\nread(\"$ \", 5)\nfor line, until in lines:\n    os.write(fd, line.encode()\
      \ + b\"\\r\")\n    sys.stdout.write(\"<<\" + line + \">>\" + read(until, 10))\n    sys.stdout.flush()\n\
      os.write(fd, b\"exit\\r\")\n"
steps:
  - wait_file: .cache/roamgate/bin/roamgate-hold
  - sh: printf "#!/bin/sh\nexec python3 ${REPO}/contract/assets/python/roamgate-hold.py \"\$@\"\n" > ${ROOT}/hbin/roamgate-hold && chmod 755 ${ROOT}/hbin/roamgate-hold
  - serve_agent_socket: job
    replies:
      hold:
        - action: suspend
          session_id: 11111111-aaaa-bbbb-cccc-000000000000
          cwd: /
          title: Fix the build
          terminal_args:
            - --model
            - haiku
        - action: resume
          session_id: 11111111-aaaa-bbbb-cccc-000000000000
          cwd: /
          argv:
            - claude
            - --resume
            - 11111111-aaaa-bbbb-cccc-000000000000
      fg:
        action: hold
        session_id: 11111111-aaaa-bbbb-cccc-000000000000
  - sh:
      cd ${ROOT} && env -i PATH=${ROOT}/hbin:/usr/bin:/bin HOME=${HOME} TERM=dumb HERDR_PANE_ID=w1:p1
      ROAMGATE_REVIEW_SOCKET=${job_socket} python3 ${ROOT}/driver.py '[["${ROOT}/hbin/roamgate-hold 11111111-aaaa-bbbb-cccc-000000000000",
      "[1]+"], ["jobs", "Stopped "], ["fg '%?11111111-aaaa-bbbb-cccc-000000000000'", "ran"]]'
    within_ms: 60000
    expect:
      exit: 0
      stdout_contains:
        - "Suspended: claude (conversation: Fix the build). fg brings it back."
        - Stopped
        - Bringing the conversation back...
        - claude --resume 11111111-aaaa-bbbb-cccc-000000000000 ran
      stdout: '{{re:\[1\]\+\s+Stopped}}'
  - agent_socket_requests:
      name: job
      command: hold
      min: 1
      calls:
        $contains:
          - command: hold
            body:
              job_control: 1
              job: 11111111-aaaa-bbbb-cccc-000000000000
      save:
        hold_holder: /0/body/holder_id
  - agent_socket_requests:
      name: job
      command: fg
      count: 1
      calls:
        - command: fg
          body:
            pane: w1:p1
            session: 11111111-aaaa-bbbb-cccc-000000000000
            cwd: /
            job_control: 1
            terminal_args: '["--model", "haiku"]'
      save:
        fg_holder: /0/body/holder_id
  - sh: "[ '${hold_holder}' != '${fg_holder}' ]"

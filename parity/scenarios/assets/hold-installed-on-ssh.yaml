name: an SSH host gets the Python roamgate-hold, the server its own binary
family: connections
description: >
  When an SSH profile connects, the server installs its agent clients on
  the host (fake-ssh runs the setup in the fake remote home): the
  roamgate-hold and roamgate-review there are the Python ones of
  contract/assets/python with their version line, byte for byte, while
  this machine's are links to the server's own binary.
server:
  herdr: false
  herdrs:
    remote: { workspaces: [{ workspace_id: w1, label: remote }] }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ALLOW_SSH: "1"
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 2
        default_connection_id: remote
        profiles:
          - {
              id: remote,
              label: REMOTE,
              type: ssh,
              ssh_destination: remote-host,
              remote_control_socket_path: "${HERDR_remote_CONTROL}",
              remote_client_socket_path: "${HERDR_remote_CLIENT}",
              auto_connect: true,
            }
steps:
  - login: {}
  - connect: {}
  - call: connections.connect
    id: up
    no_wait: true
    params: { id: remote }
  - await: up
    advance_every: 50
    reply: { state: ready, type: ssh }
  - wait_file: "${ROOT}/remote-home/.cache/roamgate/bin/roamgate-hold"
    within_ms: 20000
  - wait_file: .cache/roamgate/bin/roamgate-hold
  - sh: |
      remote="${ROOT}/remote-home/.cache/roamgate/bin"
      for name in roamgate-hold roamgate-review; do
        sed '$d' "$remote/$name" | cmp - "${REPO}/contract/assets/python/$name.py" || exit 1
        tail -n 1 "$remote/$name" | grep -Eq "^# $name [0-9a-f]{16}$" || exit 1
      done
      [ "$(readlink -f "${HOME}/.cache/roamgate/bin/roamgate-hold")" = "$(readlink -f "${SERVER_BIN}")" ]
  - fake_calls: { program: ssh, argv_match: "roamgate-hold", min: 1 }

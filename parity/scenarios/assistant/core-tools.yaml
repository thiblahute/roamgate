name: Ranger's Workspaces arrangement and archive tools answer a turn
family: assistant
description: >
  A turn calls workspace_tree_get and archive_search: the server that runs
  Ranger answers both (the Rust core on the workspace and archive families'
  code, Bun on its own), and the model's next request carries their results:
  the arrangement with the connection's workspace, and the archive's own
  word that there is none yet.
server:
  herdr: false
  start: false
  herdrs:
    healthy:
      endpoint: true
      workspaces:
        - workspace_id: w1
          label: Recovery workspace
          worktree:
            {
              repo_key: workspace,
              repo_name: workspace,
              repo_root: "${ROOT}/workspace",
              checkout_path: "${ROOT}/workspace",
              is_linked_worktree: false,
            }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ASSISTANT_DIR: "${ROOT}/ranger"
    PI_CODING_AGENT_DIR: "${ROOT}/pi"
  openai:
    anthropic:
      replies:
        - tools:
            - { name: workspace_tree_get, id: tree-read, input: {} }
            - { name: archive_search, id: archive-read, input: { query: zebra } }
      cycle:
        - text: Read the arrangement and the archive.
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 1
        default_connection_id: healthy
        profiles:
          - {
              id: healthy,
              label: Healthy,
              type: local,
              control_socket_path: "${HERDR_healthy_CONTROL}",
              client_socket_path: "${HERDR_healthy_CLIENT}",
              auto_connect: true,
            }
    "${ROOT}/ranger/auth.json":
      {
        mode: "0600",
        json: { anthropic: { type: api_key, key: synthetic-recovery-key } },
      }
    "${ROOT}/ranger/models.json":
      {
        mode: "0600",
        json: { providers: { anthropic: { baseUrl: "${FAKE_HTTP}" } } },
      }
steps:
  - sh: chmod 700 ranger && mkdir -p workspace
  - start: {}
  - login: {}
  - connect: {}
  - call: connections.connect
    params: { id: healthy }
    reply: { state: ready }
  - call: bridge.assistant.configure
    params:
      {
        config:
          {
            provider: anthropic,
            model: claude-haiku-4-5,
            credential_source: assistant,
            allowed_workspaces: [{ connection_id: healthy, workspace_id: w1 }],
          },
      }
  - call: bridge.assistant.send
    params: { text: Show me the arrangement and the archive, request_id: tools-question }
  - http_fake_calls: { fake: anthropic, count: 2 }
    retry: 10000
  - http_fake_calls:
      {
        fake: anthropic,
        index: 1,
        text_contains: [Recovery workspace, There is no session archive yet],
      }

name: Ranger runs Pi in the sidecar ROAMGATE_PI_SIDECAR names, and resumes in it after SIGTERM
family: assistant
# The wrapper is a POSIX shell script.
platforms: [linux, macos]
description: >
  With ROAMGATE_PI_SIDECAR the Bun server runs Ranger's Pi turns in that
  sidecar over stdio (contract/wire/pi-sidecar.md) instead of in-process.
  The sidecar here is a script that marks each start, then runs the
  `roamgate-pi` the harness compiled from
  server/src/assistant/pi-sidecar-main.ts (no Bun process in a Rust-only
  run). A turn reads the workspace
  through a tool handler the server answers, checkpoints its durable
  pointer before admission, and the server's stop closes the sidecar; the
  restarted server resumes the run in a new sidecar from that pointer
  without replaying the completed read or the pending action.
covers:
  - env:ROAMGATE_PI_SIDECAR
  - "exec:spawn assistant/pi-sidecar-client.ts#defaultSpawnSidecar"
server:
  herdr: false
  start: false
  herdrs:
    healthy:
      endpoint: true
      workspaces:
        - workspace_id: w1
          label: Recovery workspace
          worktree:
            {
              repo_key: workspace,
              repo_name: workspace,
              repo_root: "${ROOT}/workspace",
              checkout_path: "${ROOT}/workspace",
              is_linked_worktree: false,
            }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ASSISTANT_DIR: "${ROOT}/ranger"
    PI_CODING_AGENT_DIR: "${ROOT}/pi"
    ROAMGATE_PI_SIDECAR: "${ROOT}/pi-sidecar"
  openai:
    anthropic:
      replies:
        - tools:
            - { name: workspace_status, id: completed-status, input: {} }
            - {
                name: propose_tab_create,
                id: pending-tab,
                input: { connection_id: healthy, workspace_id: w1 },
              }
        - { partial: This interrupted answer must not be kept., hang: true }
      cycle:
        - text: Recovered the workspace status without repeating the read.
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 1
        default_connection_id: healthy
        profiles:
          - {
              id: healthy,
              label: Healthy,
              type: local,
              control_socket_path: "${HERDR_healthy_CONTROL}",
              client_socket_path: "${HERDR_healthy_CLIENT}",
              auto_connect: true,
            }
    "${ROOT}/ranger/auth.json":
      {
        mode: "0600",
        json: { anthropic: { type: api_key, key: synthetic-recovery-key } },
      }
    "${ROOT}/ranger/models.json":
      {
        mode: "0600",
        json: { providers: { anthropic: { baseUrl: "${FAKE_HTTP}" } } },
      }
steps:
  - sh: chmod 700 ranger && mkdir -p workspace
  # The sidecar: marks each start, then serves Pi as pi-sidecar-main.ts.
  - sh: >-
      printf '%s\n'
      '#!/bin/sh'
      'echo started >> "${ROOT}/pi-sidecar.starts"'
      'exec "${PI_SIDECAR}"'
      > pi-sidecar && chmod 755 pi-sidecar
  - start: {}
  - login: {}
  - connect: {}
  - call: connections.connect
    params: { id: healthy }
    reply: { state: ready }
  - call: bridge.assistant.configure
    params:
      {
        config:
          {
            provider: anthropic,
            model: claude-haiku-4-5,
            credential_source: assistant,
            allowed_workspaces: [{ connection_id: healthy, workspace_id: w1 }],
          },
      }
    # Until the core heard of the connection the server just made
    # ready, it drops a workspace of it.
    reply:
      {
        config:
          {
            allowed_workspaces: [{ connection_id: healthy, workspace_id: w1 }],
          },
      }
    retry: 10000
  - call: bridge.assistant.send
    params:
      { text: Inspect workspace and propose a tab, request_id: crash-question }
  - http_fake_calls: { fake: anthropic, count: 2 }
    retry: 10000
  # The sidecar's deltas reach the server as notifications, in real time;
  # streamed text then reaches browsers on the bridge's publishing timer.
  - call: bridge.assistant.get
    reply:
      messages:
        $contains:
          [
            {
              role: assistant,
              text: "{{contains:This interrupted answer must not be kept.}}",
            },
          ]
    retry: 10000
  - advance: 1000
  - expect_push: assistant
    message:
      assistant:
        running: true
        messages:
          {
            $contains:
              [
                {
                  role: assistant,
                  text: "{{contains:This interrupted answer must not be kept.}}",
                },
              ],
          }
    save:
      draft: "/assistant/messages/[role=assistant]/id"
      session: /assistant/session_id
      sources: "/assistant/messages/[role=assistant]/sources"
      source_id: "/assistant/messages/[role=assistant]/sources/0/id"
      action: "/assistant/messages/[role=assistant]/actions/0/id"
      draft_message: "/assistant/messages/[role=assistant]"
  - call: bridge.assistant.get
    reply:
      messages:
        $contains:
          - role: assistant
            tools:
              {
                $contains:
                  [
                    {
                      id: completed-status,
                      name: workspace_status,
                      status: completed,
                      arguments: "{}",
                      output: "{{string}}",
                    },
                  ],
              }
            sources:
              [
                {
                  kind: status,
                  connection_id: healthy,
                  workspace_id: w1,
                  read_at: "{{string}}",
                },
              ]
            actions: [{ status: pending }]
  - assert_file:
      path: "${ROOT}/ranger/state.json"
      json:
        active_run: { recovery_targets: [{ herdr_boot_id: parity-boot }] }
        entries: { $contains: [{ type: ranger-durable }] }
    retry: 10000
  - herdr_calls:
      {
        herdr: healthy,
        method: pane.list,
        where: { params: { workspace_id: w1 } },
        count: 1,
      }
  - assert_file:
      path: "${ROOT}/pi-sidecar.starts"
      text: "started\n"
  - stop: { signal: TERM }
  # No browser, get or send takes part in resuming the saved run.
  - start: {}
  - http_fake_calls: { fake: anthropic, count: 3 }
    retry: 25000
  - assert_file:
      path: "${ROOT}/ranger/state.json"
      json:
        active_run: "{{absent}}"
        messages:
          {
            $contains:
              [
                {
                  text: "{{contains:Recovered the workspace status without repeating the read.}}",
                },
              ],
          }
    retry: 10000
  - login: {}
  - connect: {}
  - call: bridge.assistant.get
    reply:
      running: false
      error: null
      session_id: "${session}"
      messages:
        - { role: user }
        - id: "${draft}"
          text: "{{contains:Recovered the workspace status without repeating the read.}}"
          sources: "${sources}"
          tools:
            {
              $contains:
                [
                  {
                    id: completed-status,
                    name: workspace_status,
                    status: completed,
                  },
                ],
            }
          actions: [{ id: "${action}", status: cancelled }]
    reply_lacks: [This interrupted answer must not be kept.]
  # The resumed run went through a second sidecar, the stopped server's one
  # having closed with it.
  - assert_file:
      path: "${ROOT}/pi-sidecar.starts"
      text: "started\nstarted\n"
  - http_fake_calls:
      {
        fake: anthropic,
        count: 3,
        index: 2,
        text_contains: [completed-status, "${source_id}"],
        text_lacks: [This interrupted answer must not be kept.],
      }
  - herdr_calls:
      {
        herdr: healthy,
        method: pane.list,
        where: { params: { workspace_id: w1 } },
        count: 1,
      }
  - herdr_calls:
      {
        herdr: healthy,
        none_match: "^(tab\\.create|pane\\.(send|focus|run|resize|split|close)|workspace\\.(create|focus|close)|terminal\\.)",
      }

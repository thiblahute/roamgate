name: the pane holder's child ends with it (TERM)
family: agent_chat
description:
  "The headless claude a pane holder started does not outlive the holder: killed outright,
  or its pane closing (a hang-up or a terminate), its child ends, and a closing pane takes the holder's
  log with it."
# Conversation mode's pane holder is typed into the pane's POSIX shell (sh,
# bash, zsh or fish, with job control), which a Windows pane does not have.
platforms: [linux, macos]
server:
  env:
    PARITY_FAKE_ENV_KEYS: ROAMGATE_HEADLESS,ROAMGATE_PANE_ID,ROAMGATE_HERDR_SOCKET_PATH,CLAUDE_CONFIG_DIR
  herdr:
    workspaces:
      - workspace_id: w1
        label: work
    panes:
      - pane_id: p1
        workspace_id: w1
        cwd: ${ROOT}/work
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: ${ROOT}/work
        agent_session:
          source: claude
          agent: claude
          kind: id
          value: 11111111-2222-4333-8444-555555555555
    terminals:
      p1:
        args:
          - --model
          - opus
  files:
    ${ROOT}/work/.keep: ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - type: user
          uuid: u1
          timestamp: "2025-12-31T23:59:00.000Z"
          sessionId: 11111111-2222-4333-8444-555555555555
          cwd: /work
          message:
            role: user
            content: hello
        - type: assistant
          uuid: a1
          timestamp: "2025-12-31T23:59:01.000Z"
          sessionId: 11111111-2222-4333-8444-555555555555
          cwd: /work
          message:
            id: msg_0
            role: assistant
            model: claude-opus
            content:
              - type: text
                text: Hi there
  fakes:
    claude:
      default_turn:
        - $echo_user: true
        - type: system
          subtype: init
          session_id: "{{session_id}}"
          cwd: /work
          model: claude-opus
        - type: assistant
          message:
            id: msg_n
            role: assistant
            model: claude-opus
            content:
              - type: text
                text: "Done: {{user_text}}"
        - type: result
          subtype: success
          is_error: false
          result: "Done: {{user_text}}"
          session_id: "{{session_id}}"
steps:
  - login: {}
  - connect: {}
  - call: agent_chat.subscribe
    params:
      pane_id: p1
  # The pane holder is typed as the installed client: installed once the
  # local agent socket listens.
  - expect_log:
      { contains: "agent socket listening key=@local", within_ms: 10000 }
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params:
      pane_id: p1
      to: conversation
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply:
      ok: true
      owner: conversation
  - call: agent_chat.send
    id: send
    no_wait: true
    params:
      pane_id: p1
      text: hello again
  - await: send
    advance_every: 200
    within_ms: 30000
  - expect_push: event:agent_chat.result
    within_ms: 20000
    message:
      data:
        text: "Done: hello again"
  - sh:
      python3 -c "import json,sys; print([json.loads(l) for l in open(sys.argv[1]) if json.loads(l)['program']=='claude'
      and '-p' in json.loads(l)['argv']][-1]['pid'], end='')" ${ROOT}/fakes/calls.jsonl
    save:
      child_pid: /stdout
  - pane_signal:
      pane: p1
      signal: TERM
  - process_gone: ${child_pid}
    within_ms: 5000
  - sh:
      for i in $(seq 100); do [ -z "$(ls -A ${HOME}/.cache/roamgate/headless 2>/dev/null)" ] && exit 0;
      sleep 0.05; done; ls -la ${HOME}/.cache/roamgate/headless; exit 1

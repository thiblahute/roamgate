name: a line of the headless claude past the agent socket's limit comes through whole, in pieces
family: agent_chat
ledger:
  - server/src/conversation/holder-child.test.ts > a line past the socket's limit comes through, in pieces
description:
  "A turn whose answer is one stream-json line of 1.3 MB (past the agent socket's 1 MiB body
  limit): the holder sends it in pieces under the limit, and the browser gets the whole text once."
server:
  env:
    PARITY_FAKE_ENV_KEYS: ROAMGATE_HEADLESS,ROAMGATE_PANE_ID,ROAMGATE_HERDR_SOCKET_PATH,CLAUDE_CONFIG_DIR
  herdr:
    workspaces:
      - workspace_id: w1
        label: work
    panes:
      - pane_id: p1
        workspace_id: w1
        cwd: ${ROOT}/work
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: ${ROOT}/work
        agent_session:
          source: claude
          agent: claude
          kind: id
          value: 11111111-2222-4333-8444-555555555555
    terminals:
      p1:
        args:
          - --model
          - opus
  files:
    ${ROOT}/work/.keep: ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - type: user
          uuid: u1
          timestamp: "2025-12-31T23:59:00.000Z"
          sessionId: 11111111-2222-4333-8444-555555555555
          cwd: /work
          message:
            role: user
            content: hello
        - type: assistant
          uuid: a1
          timestamp: "2025-12-31T23:59:01.000Z"
          sessionId: 11111111-2222-4333-8444-555555555555
          cwd: /work
          message:
            id: msg_0
            role: assistant
            model: claude-opus
            content:
              - type: text
                text: Hi there
  fakes:
    claude:
      default_turn:
        - $echo_user: true
        - type: system
          subtype: init
          session_id: "{{session_id}}"
          cwd: /work
          model: claude-opus
        - type: assistant
          message:
            id: msg_n
            role: assistant
            model: claude-opus
            content:
              - type: text
                text: "{{repeat:x:1300000}}"
        - type: result
          subtype: success
          is_error: false
          result: done
          session_id: "{{session_id}}"
steps:
  - login: {}
  - connect: {}
  - call: agent_chat.subscribe
    params:
      pane_id: p1
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params:
      pane_id: p1
      to: conversation
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply:
      ok: true
      owner: conversation
  - call: agent_chat.send
    id: send
    no_wait: true
    params:
      pane_id: p1
      text: hello again
  - await: send
    advance_every: 200
    within_ms: 30000
  - expect_push: event:agent_chat.block_stop
    within_ms: 30000
    message:
      data:
        text: "{{len:1300000}}"
  - expect_push: event:agent_chat.result
    within_ms: 20000
    message:
      data:
        text: done

name: logout after reauthentication closes earlier and later tabs, not other browsers, and ends the cookie for good
family: auth
steps:
  - login: {}
  - login: { as: other }
  - connect: { name: a }
  - login: { reuse: true }
  - connect: { name: same_browser }
  - connect: { name: other_browser, as: other }
  - http: GET /api/health
    expect: { status: 200, json: { auth_required: true } }
  - http: GET /login
    cookie: false
    expect:
      {
        status: 200,
        headers: { cache-control: no-store },
        text_contains: /roamgate-icon-192.png,
      }
  - http: GET /roamgate-icon-192.png
    cookie: false
    expect: { status: 200, headers: { content-type: image/png } }
  - http: GET /api/logout
    expect: { status: 405 }
  - http: POST /api/logout
    expect: { status: 403 }
  # The browser's jar keeps the cookie it logged out with: a copy of it.
  - http: POST /api/logout
    headers: { x-roamgate-logout: "1" }
    expect: { status: 204, headers: { set-cookie: "{{contains:Max-Age=0}}" } }
  - expect_close: { code: 4001 }
    socket: a
  - expect_close: { code: 4001 }
    socket: same_browser
  - call: bridge.ping
    socket: other_browser
  # The copy no longer logs in (contract 1.7: logout ends the cookie on the
  # server), not even after a restart; the other browser's still does.
  - http: GET /api/health
    expect: { status: 401 }
  - assert_file:
      {
        path: .config/roamgate/session-secret.revoked.json,
        mode: "0600",
        json: { version: 1, revoked: "{{object}}" },
      }
  - restart: {}
  - http: GET /api/health
    expect: { status: 401 }
  - http: GET /api/health
    as: other
    expect: { status: 200 }
  - connect: { name: other_again, as: other }
  - call: bridge.ping
    socket: other_again
  - http: GET /api/health
    cookie: false
    expect: { status: 401 }
  - http: GET /api/health
    as: other
    expect: { status: 200 }
  - http: GET /
    cookie: false
    headers: { accept: text/html }
    expect: { status: 302, headers: { location: /login } }

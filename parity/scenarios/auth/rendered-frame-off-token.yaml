name: a rendered page's frame off its token gets an error page, never the login page or a route
family: auth
steps:
  - http: GET /documentation/installing/index.html
    headers:
      &frame {
        accept: text/html,
        sec-fetch-site: cross-site,
        sec-fetch-dest: iframe,
        sec-fetch-mode: navigate,
      }
    expect: &refused
      status: 404
      headers: { content-security-policy: "{{contains:sandbox allow-scripts}}" }
      text_contains: not part of this site
  - http: GET /login
    headers: *frame
    expect: *refused
  - http: GET /
    headers: *frame
    expect: *refused
  - http: GET /api/health
    headers:
      { sec-fetch-site: cross-site, sec-fetch-dest: empty, origin: "null" }
    expect: { status: 404 }
  - http: GET /
    headers: { accept: text/html, sec-fetch-site: none }
    expect: { status: 302, headers: { location: /login } }
  - restart:
      { env: { NODE_ENV: development, ROAMGATE_PASSWORD: "" }, password: null }
  - http: GET /documentation/installing/index.html
    headers: *frame
    expect: *refused
  - http: GET /
    headers: *frame
    expect: *refused

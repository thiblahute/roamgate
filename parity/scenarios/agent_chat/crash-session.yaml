name: "a process that dies mid-turn leaves the turn marked interrupted, and a reset session moves the chat to the new one"
family: agent_chat
ledger:
  - "server/src/conversation/service.test.ts > a process exiting mid-turn leaves a notice, until the next send"
  - "server/src/conversation/service.test.ts > /clear moves the lease, the holder and Herdr's mapping"
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/work" }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: "${ROOT}/work"
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }
    terminals:
      p1: { args: [--model, opus] }
  files:
    "${ROOT}/work/.keep": ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - {
            type: user,
            uuid: u1,
            timestamp: "2025-12-31T23:59:00.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message: { role: user, content: hello },
          }
        - {
            type: assistant,
            uuid: a1,
            timestamp: "2025-12-31T23:59:01.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message:
              {
                id: msg_0,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: Hi there }],
              },
          }
  fakes:
    claude:
      answers:
        - match: crash
          turn:
            - { $echo_user: true }
            - {
                type: assistant,
                message:
                  {
                    id: msg_c,
                    role: assistant,
                    model: claude-opus,
                    content: [{ type: text, text: Starting }],
                  },
              }
            - { $exit: 3 }
        - match: clear
          turn:
            - { $echo_user: true }
            - {
                type: conversation_reset,
                new_conversation_id: 33333333-2222-4333-8444-555555555555,
                session_id: "{{session_id}}",
              }
            - {
                type: result,
                subtype: success,
                is_error: false,
                result: "",
                session_id: 33333333-2222-4333-8444-555555555555,
              }
      default_turn:
        - { $echo_user: true }
        - {
            type: system,
            subtype: init,
            session_id: "{{session_id}}",
            cwd: /work,
            model: claude-opus,
          }
        - {
            type: assistant,
            message:
              {
                id: msg_n,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: "Done: {{user_text}}" }],
              },
          }
        - {
            type: result,
            subtype: success,
            is_error: false,
            result: "Done: {{user_text}}",
            session_id: "{{session_id}}",
          }
steps:
  - login: {}
  - connect: {}
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params: { pane_id: p1, to: conversation }
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply: { ok: true, owner: conversation }
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
  - call: agent_chat.send
    params: { pane_id: p1, text: crash now }
    within_ms: 20000
  - expect_push: "event:agent_chat.block_stop"
    message: { data: { text: Starting } }
  - expect_push: "event:agent_chat.notice"
    within_ms: 20000
    message:
      {
        data:
          {
            kind: process_exited,
            text: Claude stopped in the middle of the turn (exit 3),
          },
      }
  - expect_push: "event:agent_chat.result"
    within_ms: 20000
    message:
      { data: { subtype: process_exited, is_error: true, interrupted: true } }
  - expect_push: "event:agent_chat.interrupted"
    within_ms: 20000
    message:
      { data: { interrupted: { reason: process_exited, at: "{{time}}" } } }
  - call: agent_chat.state
    params: { pane_id: p1 }
    reply: { status: stopped, interrupted: { reason: process_exited } }
  - call: agent_chat.interrupted.dismiss
    params: { pane_id: p1 }
    reply: { ok: true, $exact: true }
  - expect_push: "event:agent_chat.interrupted"
    message: { data: { interrupted: null } }
  - call: agent_chat.send
    params: { pane_id: p1, text: clear the context }
    within_ms: 20000
  # The event's own session_id is the envelope's: the lease's, still the
  # old one when it is sent (server/src/conversation/service.ts emit).
  - expect_push: "event:agent_chat.session"
    within_ms: 20000
    message:
      {
        data: { type: session, previous: 11111111-2222-4333-8444-555555555555 },
      }
  - expect_push: "event:agent_chat.lease"
    message: { data: { session_id: 33333333-2222-4333-8444-555555555555 } }
  - expect_push: "event:agent_chat.result"
  - call: agent_chat.state
    params: { pane_id: p1 }
    reply: { session_id: 33333333-2222-4333-8444-555555555555 }

name: "a turn silent for ten minutes is shown stuck, an idle conversation is put to sleep, and a spoken message wakes it"
family: agent_chat
# Conversation mode's pane holder is typed into the pane's POSIX shell (sh,
# bash, zsh or fish, with job control), which a Windows pane does not have.
platforms: [linux, macos]
server:
  # After any real file time: the stuck watch takes the transcript's
  # modification time when it is later than the turn's last output.
  epoch: 4102444800000
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/work" }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: "${ROOT}/work"
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }
    terminals:
      p1: { args: [--model, opus] }
  files:
    "${ROOT}/work/.keep": ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - {
            type: user,
            uuid: u1,
            timestamp: "2025-12-31T23:59:00.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message: { role: user, content: hello },
          }
        - {
            type: assistant,
            uuid: a1,
            timestamp: "2025-12-31T23:59:01.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message:
              {
                id: msg_0,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: Hi there }],
              },
          }
  fakes:
    claude:
      answers:
        - match: think
          turn:
            - { $echo_user: true }
            - {
                type: system,
                subtype: init,
                session_id: "{{session_id}}",
                cwd: /work,
                model: claude-opus,
              }
            - {
                type: assistant,
                message:
                  {
                    id: msg_1,
                    role: assistant,
                    model: claude-opus,
                    content: [{ type: text, text: Thinking hard }],
                  },
              }
            - { $await_control: interrupt }
            - {
                type: result,
                subtype: error_during_execution,
                is_error: true,
                result: "",
                terminal_reason: aborted_streaming,
                session_id: "{{session_id}}",
              }
      default_turn:
        - { $echo_user: true }
        - {
            type: system,
            subtype: init,
            session_id: "{{session_id}}",
            cwd: /work,
            model: claude-opus,
          }
        - {
            type: assistant,
            message:
              {
                id: msg_n,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: "Done: {{user_text}}" }],
              },
          }
        - {
            type: result,
            subtype: success,
            is_error: false,
            result: "Done: {{user_text}}",
            session_id: "{{session_id}}",
          }
steps:
  - login: {}
  - connect: {}
  # The pane holder is typed as the installed client: installed once the
  # local agent socket listens.
  - expect_log:
      { contains: "agent socket listening key=@local", within_ms: 10000 }
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params: { pane_id: p1, to: conversation }
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply: { ok: true, owner: conversation }
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
  - call: agent_chat.send
    params: { pane_id: p1, text: think }
    within_ms: 20000
  - expect_push: "event:agent_chat.block_stop"
    message: { data: { text: Thinking hard } }
  # Nothing from claude for ten minutes: checked every minute.
  - advance: 540000
  - expect_no_push: "event:agent_chat.stuck"
  - advance: 120000
  - expect_push: "event:agent_chat.stuck"
    message: { data: { stuck: { since: "{{time}}", reason: silent } } }
  - call: agent_chat.state
    params: { pane_id: p1 }
    reply: { status: working }
  - call: agent_chat.interrupt
    params: { pane_id: p1 }
    within_ms: 20000
    reply: { interrupted: true }
  - expect_pushes:
      - {
          push: "event:agent_chat.result",
          message: { data: { interrupted: true } },
        }
  - expect_push: "event:agent_chat.stuck"
    message: { data: { stuck: null } }
  # Idle stop after a minute, once no browser has been active for ten.
  - call: settings.conversation.update
    params: { idle_stop_minutes: 1 }
    reply: { idle_stop_minutes: 1 }
  - advance: 600000
  - advance: 120000
  - expect_push: "event:agent_chat.asleep"
    message: { data: { asleep: { since: "{{time}}" } } }
  - expect_push: "event:agent_chat.status"
    message: { data: { status: stopped } }
  - call: agent_chat.state
    params: { pane_id: p1 }
    reply:
      { owner: conversation, status: stopped, asleep: { since: "{{time}}" } }
  - call: agent_chat.voice
    params: { pane_id: p1, text: hello by voice }
    within_ms: 20000
    reply: { action: sent, id: "{{uuid}}" }
  - expect_pushes:
      - {
          push: "event:agent_chat.status",
          message: { data: { status: starting, activity: waking } },
        }
      - { push: "event:agent_chat.asleep", message: { data: { asleep: null } } }
      - {
          push: "event:agent_chat.result",
          message: { data: { text: "Done: hello by voice" } },
        }
    within_ms: 20000
  - fake_calls:
      {
        program: claude,
        argv_match: "-p --resume 11111111-2222-4333-8444-555555555555",
        count: 2,
      }

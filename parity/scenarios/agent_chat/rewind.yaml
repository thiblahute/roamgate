name: "the chat rewinds the conversation to an earlier message, and refuses while messages wait"
family: agent_chat
ledger:
  - "server/src/conversation/service.test.ts > the headless process rewinds; lease and holder stay, no second writer"
  - "server/src/conversation/service.test.ts > the RPC validates its mode and message"
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/work" }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: "${ROOT}/work"
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }
    terminals:
      p1: { args: [--model, opus] }
  files:
    "${ROOT}/work/.keep": ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - {
            type: user,
            uuid: u1,
            timestamp: "2025-12-31T23:59:00.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message: { role: user, content: hello },
          }
        - {
            type: assistant,
            uuid: a1,
            timestamp: "2025-12-31T23:59:01.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message:
              {
                id: msg_0,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: Hi there }],
              },
          }
  fakes:
    claude:
      control:
        rewind_conversation: { rewound: true, prefillText: first }
      default_turn:
        - { $echo_user: true }
        - {
            type: system,
            subtype: init,
            session_id: "{{session_id}}",
            cwd: /work,
            model: claude-opus,
          }
        - {
            type: assistant,
            message:
              {
                id: msg_n,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: "Done: {{user_text}}" }],
              },
          }
        - {
            type: result,
            subtype: success,
            is_error: false,
            result: "Done: {{user_text}}",
            session_id: "{{session_id}}",
          }
steps:
  - login: {}
  - connect: {}
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params: { pane_id: p1, to: conversation }
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply: { ok: true, owner: conversation }
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
  - call: agent_chat.send
    params:
      { pane_id: p1, text: first, uuid: 20000000-0000-4000-8000-000000000001 }
    within_ms: 20000
  - expect_push: "event:agent_chat.result"
  - call: agent_chat.rewind.check
    params: { pane_id: p1, uuid: 20000000-0000-4000-8000-000000000001 }
    reply: { code: unknown }
  - call: agent_chat.rewind
    params:
      {
        pane_id: p1,
        uuid: 20000000-0000-4000-8000-000000000001,
        mode: conversation,
      }
    within_ms: 20000
    reply: { ok: true, prefill: first, $exact: true }
  - expect_push: "event:agent_chat.rewound"
    message: { data: { uuid: 20000000-0000-4000-8000-000000000001 } }
  - call: agent_chat.rewind
    params:
      {
        pane_id: p1,
        uuid: 20000000-0000-4000-8000-000000000001,
        mode: sideways,
      }
    error: { message: "mode is both, conversation or code" }
  - call: agent_chat.rewind
    params: { pane_id: p1, mode: conversation }
    error: { message: uuid is required }
contract_exceptions:
  - {
      surface: rpc.request,
      name: agent_chat.rewind,
      kind: mismatch,
      reason: "a bad mode and a missing uuid, refused on purpose",
    }

name: messages typed during a turn are queued, edited and removed, and an interrupt ends the turn so the queue runs
family: agent_chat
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/work" }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: "${ROOT}/work"
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }
    terminals:
      p1: { args: [--model, opus] }
  files:
    "${ROOT}/work/.keep": ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - {
            type: user,
            uuid: u1,
            timestamp: "2025-12-31T23:59:00.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message: { role: user, content: hello },
          }
        - {
            type: assistant,
            uuid: a1,
            timestamp: "2025-12-31T23:59:01.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message:
              {
                id: msg_0,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: Hi there }],
              },
          }
  fakes:
    claude:
      turns:
        - - { $echo_user: true }
          - {
              type: system,
              subtype: init,
              session_id: "{{session_id}}",
              cwd: /work,
              model: claude-opus,
            }
          - {
              type: assistant,
              message:
                {
                  id: msg_1,
                  role: assistant,
                  model: claude-opus,
                  content: [{ type: text, text: "On it: {{user_text}}" }],
                },
            }
          - { $await_control: interrupt }
          - {
              type: user,
              message: { role: user, content: "[Request interrupted by user]" },
            }
          - {
              type: result,
              subtype: error_during_execution,
              is_error: true,
              result: "",
              terminal_reason: aborted_streaming,
              session_id: "{{session_id}}",
            }
      default_turn:
        - { $echo_user: true }
        - {
            type: assistant,
            message:
              {
                id: msg_n,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: "Done: {{user_text}}" }],
              },
          }
        - {
            type: result,
            subtype: success,
            is_error: false,
            result: "Done: {{user_text}}",
            session_id: "{{session_id}}",
          }
steps:
  - login: {}
  - connect: {}
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params: { pane_id: p1, to: conversation }
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply: { ok: true, owner: conversation }
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
  - drain: {}
  - call: agent_chat.send
    params:
      { pane_id: p1, text: first, uuid: 10000000-0000-4000-8000-000000000001 }
    within_ms: 20000
  - expect_push: "event:agent_chat.user"
    message: { data: { text: first } }
  - expect_push: "event:agent_chat.block_stop"
    message: { data: { text: "On it: first" } }
  - call: agent_chat.send
    params:
      { pane_id: p1, text: second, uuid: 10000000-0000-4000-8000-000000000002 }
    reply: { status: queued, id: 10000000-0000-4000-8000-000000000002 }
  - call: agent_chat.send
    params:
      { pane_id: p1, text: third, uuid: 10000000-0000-4000-8000-000000000003 }
    reply: { status: queued }
  - expect_pushes:
      - {
          push: "event:agent_chat.queue",
          message:
            {
              data:
                {
                  queue:
                    [
                      {
                        id: 10000000-0000-4000-8000-000000000002,
                        text: second,
                        images: [],
                        queued_at: "{{time}}",
                      },
                    ],
                },
            },
        }
      - {
          push: "event:agent_chat.queue",
          message: { data: { queue: [{ text: second }, { text: third }] } },
        }
  - call: agent_chat.queue.edit
    params:
      {
        pane_id: p1,
        id: 10000000-0000-4000-8000-000000000002,
        text: "second, edited",
      }
    reply: { edited: true, $exact: true }
  - expect_push: "event:agent_chat.queue"
    message: { data: { queue: [{ text: "second, edited" }, { text: third }] } }
  - call: agent_chat.queue.remove
    params: { pane_id: p1, id: 10000000-0000-4000-8000-000000000003 }
    reply:
      {
        removed:
          {
            id: 10000000-0000-4000-8000-000000000003,
            text: third,
            images: [],
            queued_at: "{{time}}",
          },
      }
  - call: agent_chat.queue.remove
    params: { pane_id: p1, id: 10000000-0000-4000-8000-000000000099 }
    reply: { removed: null, $exact: true }
  - call: agent_chat.queue.edit
    params:
      { pane_id: p1, id: 10000000-0000-4000-8000-000000000099, text: nope }
    reply: { edited: false, $exact: true }
  - call: agent_chat.state
    params: { pane_id: p1 }
    reply:
      {
        status: working,
        queue:
          [
            {
              id: 10000000-0000-4000-8000-000000000002,
              text: "second, edited",
            },
          ],
      }
  - call: agent_chat.interrupt
    params: { pane_id: p1 }
    within_ms: 20000
    reply: { interrupted: true, $exact: true }
  - expect_pushes:
      - {
          push: "event:agent_chat.result",
          message:
            {
              data:
                {
                  subtype: error_during_execution,
                  is_error: true,
                  interrupted: true,
                  text: "",
                },
            },
        }
      - {
          push: "event:agent_chat.user",
          message:
            {
              data:
                {
                  uuid: 10000000-0000-4000-8000-000000000002,
                  text: "second, edited",
                },
            },
        }
      - {
          push: "event:agent_chat.result",
          message: { data: { subtype: success, text: "Done: second, edited" } },
        }
    within_ms: 20000
  - expect_push: "event:agent_chat.queue"
    message: { data: { queue: [] } }
  - call: agent_chat.interrupt
    params: { pane_id: p1 }
    reply: { interrupted: false }
  - call: agent_chat.queue.edit
    params: { pane_id: p1 }
    error: { message: "{{contains:id is required}}" }
contract_exceptions:
  - {
      surface: rpc.request,
      name: agent_chat.queue.edit,
      kind: mismatch,
      reason: "an edit without an id, refused on purpose",
    }

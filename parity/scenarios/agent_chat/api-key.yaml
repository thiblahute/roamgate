name: "a pane with an API key Claude Code would use unasked: the chat asks which to use, and the answer starts it"
family: agent_chat
ledger:
  - "server/src/conversation/service.test.ts > the answer RPC checks what it is given"
server:
  env: { ANTHROPIC_API_KEY: sk-ant-api03-parity-0123456789abcdefghij }
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/work" }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: "${ROOT}/work"
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }
    terminals:
      p1: { args: [--model, opus] }
  files:
    "${ROOT}/work/.keep": ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - {
            type: user,
            uuid: u1,
            timestamp: "2025-12-31T23:59:00.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message: { role: user, content: hello },
          }
        - {
            type: assistant,
            uuid: a1,
            timestamp: "2025-12-31T23:59:01.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message:
              {
                id: msg_0,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: Hi there }],
              },
          }
  fakes:
    claude:
      default_turn:
        - { $echo_user: true }
        - {
            type: system,
            subtype: init,
            session_id: "{{session_id}}",
            cwd: /work,
            model: claude-opus,
          }
        - {
            type: assistant,
            message:
              {
                id: msg_n,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: "Done: {{user_text}}" }],
              },
          }
        - {
            type: result,
            subtype: success,
            is_error: false,
            result: "Done: {{user_text}}",
            session_id: "{{session_id}}",
          }
steps:
  - login: {}
  - connect: {}
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params: { pane_id: p1, to: conversation }
  - await: handover
    advance_every: 200
    within_ms: 30000
    reply: { ok: true, owner: conversation }
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
  # The holder says the pane has a key Claude Code has no answer for: the
  # start that follows the handover waits for the user.
  - expect_push: "event:agent_chat.api_key_question"
    within_ms: 20000
    message: { data: { api_key_question: { asked_at: "{{time}}" } } }
  - call: agent_chat.state
    params: { pane_id: p1 }
    reply: { api_key_question: { asked_at: "{{time}}" } }
  - call: agent_chat.send
    params: { pane_id: p1, text: hello }
    reply: { status: queued }
  - call: agent_chat.api_key.answer
    params: { pane_id: p1, use: login }
    reply: { ok: true, $exact: true }
  - expect_pushes:
      - {
          push: "event:agent_chat.api_key_question",
          message: { data: { api_key_question: null } },
        }
      - { push: "event:agent_chat.user", message: { data: { text: hello } } }
      - {
          push: "event:agent_chat.result",
          message: { data: { text: "Done: hello" } },
        }
    within_ms: 20000
  # Its login, not the key: the key is not in the headless claude's
  # environment.
  - fake_calls:
      program: claude
      argv_match: "-p --resume"
      count: 1
      calls: [{ env: { ANTHROPIC_API_KEY: "{{absent}}" } }]
  - call: agent_chat.api_key.answer
    params: { pane_id: p1, use: maybe }
    error: { message: use is api_key or login }
contract_exceptions:
  - {
      surface: rpc.request,
      name: agent_chat.api_key.answer,
      kind: mismatch,
      reason: "an answer that is neither, refused on purpose",
    }

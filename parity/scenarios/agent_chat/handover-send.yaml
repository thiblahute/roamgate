name: an idle terminal Claude is handed to conversation mode, which sends a message and streams the turn
family: agent_chat
ledger:
  - "server/src/conversation/service.test.ts > takes over, reports to Herdr, and warms the headless process"
  - "server/src/conversation/service.test.ts > conversation mode takes it once Claude is up: /exit, then the holder in that pane"
description: >
  The pane runs an idle Claude TUI (a fake Herdr terminal pane). The
  handover exits it, types the pane holder into the shell (it runs for real
  and polls the agent socket), and conversation mode owns the session; a
  message starts the headless claude (fake-claude) through the holder and
  its turn streams to the subscribed browser.
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/work" }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: idle
        cwd: "${ROOT}/work"
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }
    terminals:
      p1: { args: [--model, opus] }
  files:
    "${ROOT}/work/.keep": ""
    .claude/projects/-work/11111111-2222-4333-8444-555555555555.jsonl:
      jsonl:
        - {
            type: user,
            uuid: u1,
            timestamp: "2025-12-31T23:59:00.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message: { role: user, content: hello },
          }
        - {
            type: assistant,
            uuid: a1,
            timestamp: "2025-12-31T23:59:01.000Z",
            sessionId: 11111111-2222-4333-8444-555555555555,
            cwd: /work,
            message:
              {
                id: msg_0,
                role: assistant,
                model: claude-opus,
                content: [{ type: text, text: Hi there }],
              },
          }
  fakes:
    claude:
      turns:
        - - {
              type: system,
              subtype: init,
              session_id: "{{session_id}}",
              cwd: /work,
              model: claude-opus,
            }
          - {
              type: stream_event,
              event: { type: message_start, message: { id: msg_1 } },
            }
          - {
              type: stream_event,
              event:
                {
                  type: content_block_start,
                  index: 0,
                  content_block: { type: text, text: "" },
                },
            }
          - {
              type: stream_event,
              event:
                {
                  type: content_block_delta,
                  index: 0,
                  delta: { type: text_delta, text: "Hello " },
                },
            }
          - {
              type: stream_event,
              event:
                {
                  type: content_block_delta,
                  index: 0,
                  delta: { type: text_delta, text: back },
                },
            }
          - {
              type: stream_event,
              event: { type: content_block_stop, index: 0 },
            }
          - {
              type: assistant,
              message:
                {
                  id: msg_1,
                  role: assistant,
                  model: claude-opus,
                  content: [{ type: text, text: Hello back }],
                },
            }
          - {
              type: result,
              subtype: success,
              is_error: false,
              result: Hello back,
              session_id: "{{session_id}}",
              total_cost_usd: 0.01,
              duration_ms: 1200,
            }
steps:
  - login: {}
  - connect: {}
  # The connection's Herdr events come through (its runtime then asks the
  # browsers to read the session again, before or after this one connected:
  # with the Rust core owning the family, the run waits for the core first).
  - expect_log: { contains: subscribed to Herdr events, within_ms: 10000 }
  - call: agent_chat.state
    params: { pane_id: p1 }
    golden: state-terminal
  - call: agent_chat.handover
    id: handover
    no_wait: true
    params: { pane_id: p1, to: conversation }
  - await: handover
    advance_every: 200
    within_ms: 30000
    normalize: [run-paths, iso-time]
    golden: handover
  - call: agent_chat.subscribe
    params: { pane_id: p1 }
    normalize: [run-paths, iso-time]
    golden: subscribed
  - call: agent_chat.send
    id: send
    no_wait: true
    params: { pane_id: p1, text: hello again }
  # Sent, or queued when the process the hand-over warms up is not up yet
  # (a loaded machine): it goes once it is, the same turn either way.
  - await: send
    advance_every: 200
    within_ms: 30000
    reply: { status: "{{re:^(sent|queued)$}}", id: "{{uuid}}" }
  - expect_push: "event:agent_chat.result"
    within_ms: 20000
  - herdr_calls:
      {
        all_valid: true,
        method: pane.send_text,
        count: 1,
        calls:
          [
            {
              params:
                {
                  pane_id: p1,
                  text: "{{contains:roamgate-hold 11111111-2222-4333-8444-555555555555 --socket}}",
                },
            },
          ],
      }
  - herdr_calls:
      {
        method: agent.prompt,
        count: 1,
        calls: [{ params: { target: p1, text: /exit } }],
      }
  - assert_file:
      path: .config/roamgate/conversation-leases.json
      mode: "0600"
      normalize: [run-paths]
      json:
        version: 1
        leases:
          - {
              pane_id: p1,
              session_id: 11111111-2222-4333-8444-555555555555,
              cwd: $ROOT/work,
              phase: conversation,
              owner: conversation,
              connection_id: legacy-default,
              terminal_args: [--model, opus],
              holder: { id: "{{string}}" },
              headless_pid: "{{integer}}",
              headless_session_ids: [11111111-2222-4333-8444-555555555555],
            }

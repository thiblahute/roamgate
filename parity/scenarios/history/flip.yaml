name: the history repo changes hands with one writer at a time, each side committing on what the other wrote
family: history
description: >
  Backward and coexistence data test of the history family (plan 5.7). The
  core owns the family: a Work change of the board is its own commit and a
  pass writes the areas. The owners table gives the family back to Bun,
  whose runtime starts once the core's stopped and commits the next change
  on the core's repo; given to Rust again, Bun's stops first and the core
  commits on Bun's. The authors, subjects and trailers are the same either
  way.
server:
  env:
    ROAMGATE_CORE_BIN: "${CORE}"
    ROAMGATE_HISTORY: ""
  files:
    ".config/roamgate/runtime/owners.json":
      mode: "0600"
      json:
        version: 1
        owners: { history: rust }
        shadow: { enabled: false, rate: 0 }
steps:
  - login: {}
  - connect: {}
  - expect_log: { contains: local history handed to the Rust core, within_ms: 10000 }
  - call: bridge.work.add
    params: { title: Written by Rust, state: open }
    save: { rust_item: /result/item/id }
  - http: POST /api/history/commit
    headers: { x-roamgate-settings: "1" }
    body: {}
    expect: { status: 200, json: { exists: true, commits: 3, errors: [] } }
  # Back to Bun: the core's runtime stops before Bun's starts.
  - write:
      path: "${DATA}/runtime/owners.json"
      mode: "0600"
      json:
        version: 1
        owners: { history: bun }
        shadow: { enabled: false, rate: 0 }
  - expect_log: { contains: local history written by Bun again, within_ms: 10000 }
  - call: bridge.work.update
    params: { item: "${rust_item}", state: doing }
    reply: { item: { id: "${rust_item}", state: doing } }
  - http: POST /api/history/commit
    headers: { x-roamgate-settings: "1" }
    body: {}
    expect: { status: 200, json: { commits: 5, errors: [] } }
  # And to Rust again: Bun's stops first, the core commits on Bun's repo.
  - write:
      path: "${DATA}/runtime/owners.json"
      mode: "0600"
      json:
        version: 1
        owners: { history: rust }
        shadow: { enabled: false, rate: 0 }
  - expect_log:
      matches: "(?s)written by Bun again.*local history handed to the Rust core"
      within_ms: 10000
  - call: bridge.work.update
    params: { item: "${rust_item}", state: done }
    reply: { item: { id: "${rust_item}", state: done } }
  - http: POST /api/history/commit
    headers: { x-roamgate-settings: "1" }
    body: {}
    expect: { status: 200, json: { commits: 7, errors: [] } }
  - sh: git -C ${DATA}/history log --format='%an|%s%n%b' -- work/items/${rust_item}.md
    expect:
      exit: 0
      stdout_contains:
        - ': state done "Written by Rust"'
        - ': state doing "Written by Rust"'
        - ' "Written by Rust"'
        - "By the user."
        - "Roamgate-Host: "
  - sh: test "$(git -C ${DATA}/history log --format=%cn | sort -u)" = Roamgate
    expect: { exit: 0 }

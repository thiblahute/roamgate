name: The Rust front runs the Bun server as its portless core, which serves the forwarded routes and runs the Rust core for its families
family: core_channel
description: >
  Stage 2 (contract/wire/core-channel.md): the front holds the port and
  spawns the Bun server with ROAMGATE_CORE_CHANNEL and ROAMGATE_CORE_TOKEN;
  the core connects, says hello with the token, and answers what the front
  forwards: an HTTP route behind the gate and a browser socket's call. With
  ROAMGATE_CORE_BIN, passed on by the front, the Bun core runs the Rust core
  (given the front's executable as ROAMGATE_CLI_EXEC and
  ROAMGATE_CLI_STANDALONE) and routes the family the owners table gives it.
fronts: [rust]
covers:
  - env:ROAMGATE_CORE_CHANNEL
  - env:ROAMGATE_CORE_TOKEN
  - env:ROAMGATE_CLI_EXEC
  - env:ROAMGATE_CLI_STANDALONE
server:
  env:
    ROAMGATE_CORE_BIN: "${CORE}"
    ROAMGATE_CORE_SERVED_LOG: "${ROOT}/served.log"
  files:
    ".config/roamgate/runtime/owners.json":
      mode: "0600"
      json:
        version: 1
        owners: { settings: rust }
        shadow: { enabled: false, rate: 0 }
steps:
  - login: {}
  - http: GET /api/health
    expect: { status: 200, json: { ok: true, auth_required: true } }
  - connect: {}
  - call: bridge.ping
    reply: { ok: true }
  - expect_log: { contains: "serving the settings family", within_ms: 30000 }
  - http: PUT /api/instance-settings
    headers: { x-roamgate-settings: "1" }
    body: { title_suffix: Front }
    expect: { status: 200 }
  - assert_file: { path: "${ROOT}/served.log", text_contains: "settings " }

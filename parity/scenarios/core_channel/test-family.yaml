name: The server's core serves the channel's test family
family: core_channel
description: >
  The front runs its own executable as its core and serves beside it over
  the internal channel (contract/wire/core-channel.md). The channel's own
  test family (ROAMGATE_CORE_TEST, a debug core only) answers a browser
  call with what the front knew of it, makes a reverse call answered in
  the core, and streams an HTTP body both ways through the core; a method
  of no family is the front family's.
covers:
  - env:ROAMGATE_CORE_TEST
  - env:ROAMGATE_CORE_CHANNEL
  - env:ROAMGATE_CORE_TOKEN
  - env:ROAMGATE_CLI_EXEC
  - env:ROAMGATE_CLI_STANDALONE
server:
  env:
    ROAMGATE_CORE_TEST: "1"
steps:
  - login: {}
  - connect: {}
  - call: test.echo.read
    params: { a: 1, nested: { b: [1, 2] } }
    reply:
      params: { a: 1, nested: { b: [1, 2] } }
      ctx: { socket_id: "{{present}}" }
  - call: test.echo.reverse
    params: { asked: from the core }
    reply: { args: { asked: from the core } }
  - call: bridge.ping
    reply: { ok: true }
  - http: GET /api/test-echo/stream?bytes=600000
    expect: { status: 200, body_length: 600000 }
  - http: POST /api/test-echo/stream
    text: echoed through the core
    expect: { status: 200, text: echoed through the core }
contract_exceptions:
  - surface: rpc.request
    name: test.echo.read
    reason: the channel's test family, served only with ROAMGATE_CORE_TEST from source, is not part of the server's surface
  - surface: rpc.reply
    name: test.echo.read
    reason: the channel's test family is not part of the server's surface
  - surface: rpc.request
    name: test.echo.reverse
    reason: the channel's test family is not part of the server's surface
  - surface: rpc.reply
    name: test.echo.reverse
    reason: the channel's test family is not part of the server's surface
  - surface: http
    name: POST /api/test-echo/stream
    reason: the channel's test family is not part of the server's surface

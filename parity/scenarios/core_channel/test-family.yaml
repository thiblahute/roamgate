name: The Bun server runs its Rust core and routes a family the owners table gives it
family: core_channel
description: >
  With ROAMGATE_CORE_BIN the Bun server spawns the Rust core and serves
  beside it over the internal channel (contract/wire/core-channel.md). The
  channel's own test family (ROAMGATE_CORE_TEST, from source and a debug
  core only), given to Rust by <data>/runtime/owners.json, answers a browser
  call with what the front knew of it, calls back into Bun, and streams an
  HTTP body both ways through the core; a method of no family stays with Bun.
# Stage 1: the Bun server holds the port and spawns the Rust core. A Rust
# front's Bun core never runs a core of its own.
fronts: [bun]
covers:
  - env:ROAMGATE_CORE_BIN
  - env:ROAMGATE_CORE_TEST
  - "exec:spawn core-channel/supervisor.ts#defaultSpawn"
server:
  env:
    ROAMGATE_CORE_BIN: "${CORE}"
    ROAMGATE_CORE_TEST: "1"
  files:
    ".config/roamgate/runtime/owners.json":
      mode: "0600"
      json:
        version: 1
        owners: { test.echo: rust }
        shadow: { enabled: false, rate: 0 }
steps:
  - login: {}
  - connect: {}
  - call: test.echo.read
    params: { a: 1, nested: { b: [1, 2] } }
    reply:
      params: { a: 1, nested: { b: [1, 2] } }
      ctx: { socket_id: "{{present}}" }
  - call: test.echo.reverse
    params: { asked: from the core }
    reply: { args: { asked: from the core } }
  - call: bridge.ping
    reply: { ok: true }
  - http: GET /api/test-echo/stream?bytes=600000
    expect: { status: 200, body_length: 600000 }
  - http: POST /api/test-echo/stream
    text: echoed through the core
    expect: { status: 200, text: echoed through the core }
contract_exceptions:
  - surface: rpc.request
    name: test.echo.read
    reason: the channel's test family, served only with ROAMGATE_CORE_TEST from source, is not part of the server's surface
  - surface: rpc.reply
    name: test.echo.read
    reason: the channel's test family is not part of the server's surface
  - surface: rpc.request
    name: test.echo.reverse
    reason: the channel's test family is not part of the server's surface
  - surface: rpc.reply
    name: test.echo.reverse
    reason: the channel's test family is not part of the server's surface
  - surface: http
    name: POST /api/test-echo/stream
    reason: the channel's test family is not part of the server's surface

name: the voice family changes hands between Bun and the Rust core with one helper at a time
family: voice
description: >
  The owners table gives voice to the Rust core, then back to Bun. Bun's
  helper speaks first; when the core takes the family it asks Bun to
  release voice (`voice.release`): Bun closes its voice sockets and stops
  its helper before the core starts its own for the next sentence. Given
  back, the core stops its helper (`internal.voice.release`) before Bun
  starts one again. At every point at most one helper runs.
server:
  env:
    ROAMGATE_CORE_BIN: "${CORE}"
    HTTPS_PROXY: "http://127.0.0.1:9"
    https_proxy: "http://127.0.0.1:9"
  files:
    ".config/roamgate/runtime/owners.json":
      mode: "0600"
      json:
        version: 1
        owners: { voice: bun }
        shadow: { enabled: false, rate: 0 }
    .config/roamgate/voice.json:
      json:
        helper: "${BIN}/roamgate-voice"
        whisper_model: "${BIN}/roamgate-voice"
        tts_models:
          [
            {
              model: kokoro,
              path: "${BIN}/roamgate-voice",
              voices: "${BIN}/roamgate-voice",
            },
          ]
  fakes:
    roamgate-voice:
      replies:
        speak: { audio: T2dnUw==, language: en, nativeRate: 1 }
steps:
  - login: {}
  - connect: {}
  # Bun's helper speaks.
  - http: POST /api/voice/speak
    headers: { x-roamgate-voice: "1" }
    body: { text: Hello, language: en, rate: 1 }
    expect: { status: 200, text: OggS }
  - sh: &helpers >-
      python3 -c "import json,os,sys;
      calls=[json.loads(l) for l in open(sys.argv[1])];
      alive=lambda p : os.path.exists('/proc/%d/stat' % p) and open('/proc/%d/stat' % p).read().rsplit(')',1)[1].split()[0]!='Z';
      print(sum(1 for c in calls if c['program']=='roamgate-voice' and alive(c['pid'])), end='')"
      ${ROOT}/fakes/calls.jsonl
    expect: { stdout: "1" }
  - sh: &last_helper >-
      python3 -c "import json,sys; print([json.loads(l) for l in open(sys.argv[1])
      if json.loads(l)['program']=='roamgate-voice'][-1]['pid'], end='')"
      ${ROOT}/fakes/calls.jsonl
    save:
      bun_helper: /stdout
  - connect: { name: page, path: /api/voice/ws }
  # To the Rust core: Bun's socket closes, its helper stops first.
  - write:
      path: "${DATA}/runtime/owners.json"
      mode: "0600"
      json:
        version: 1
        owners: { voice: rust }
        shadow: { enabled: false, rate: 0 }
  - expect_log: { matches: "voice handed to the Rust core", within_ms: 10000 }
  - expect_close: { code: 1012 }
    socket: page
    within_ms: 10000
  - process_gone: ${bun_helper}
    within_ms: 10000
  - http: POST /api/voice/speak
    headers: { x-roamgate-voice: "1" }
    body: { text: Hello again, language: en, rate: 1 }
    expect: { status: 200, text: OggS }
  - sh: *helpers
    expect: { stdout: "1" }
  - sh: *last_helper
    save:
      core_helper: /stdout
  - fake_calls:
      program: roamgate-voice
      count: 2
  # Back to Bun: the core's helper stops before Bun's starts.
  - write:
      path: "${DATA}/runtime/owners.json"
      mode: "0600"
      json:
        version: 1
        owners: { voice: bun }
        shadow: { enabled: false, rate: 0 }
  - expect_log: { matches: "voice served by Bun again", within_ms: 10000 }
  - process_gone: ${core_helper}
    within_ms: 10000
  - http: POST /api/voice/speak
    headers: { x-roamgate-voice: "1" }
    body: { text: Hello at last, language: en, rate: 1 }
    expect: { status: 200, text: OggS }
  - sh: *helpers
    expect: { stdout: "1" }
  - fake_calls:
      program: roamgate-voice
      count: 3

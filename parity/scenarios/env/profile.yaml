name: ROAMGATE_PROFILE samples the CPU for ROAMGATE_PROFILE_DURATION seconds into ROAMGATE_PROFILE_DIR
family: env
description: >
  The profile ends on the server's clock: after the duration a
  roamgate-<id> directory under the profile directory holds cpu.json and
  summary.txt.
server:
  env:
    {
      ROAMGATE_PROFILE: "1",
      ROAMGATE_PROFILE_DURATION: "2",
      ROAMGATE_PROFILE_DIR: "${ROOT}/profiles",
    }
steps:
  - login: {}
  - advance: 2500
  # The capture's files are written as it ends, on a thread of their own
  # (the Rust server's sampler): real I/O after the timer.
  - sh: ls profiles/roamgate-*/cpu.json profiles/roamgate-*/summary.txt | sed 's#roamgate-[^/]*#roamgate-ID#'
    within_ms: 20000
    retry: 10000
    expect:
      {
        exit: 0,
        stdout: "profiles/roamgate-ID/cpu.json\nprofiles/roamgate-ID/summary.txt\n",
      }

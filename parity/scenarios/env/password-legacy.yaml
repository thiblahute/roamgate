name: HERDR_GUI_PASSWORD is the login password unless ROAMGATE_PASSWORD is set, even empty
family: env
ledger:
  - "server/src/config/environment.test.ts > new names override legacy names without mutating the environment"
description: >
  ROAMGATE_<X> takes precedence over HERDR_GUI_<X>, an explicitly empty
  value included (contract/env.md): the legacy password logs in alone, and an
  empty ROAMGATE_PASSWORD beside it means the generated token.
server:
  password: null
  env: { HERDR_GUI_PASSWORD: legacy-password-0123456789 }
steps:
  - login: { password: legacy-password-0123456789 }
  - expect_log: { contains: ["authentication required mode=password"] }
  - restart: { env: { ROAMGATE_PASSWORD: "" } }
  - expect_log: { contains: ['mode="generated token"'] }
  - http: POST /api/login
    cookie: false
    body: { password: legacy-password-0123456789 }
    expect: { status: 401 }
  - assert_file: { path: .config/roamgate/auth-token, save_text: token }
  - login: { password: "${token}" }

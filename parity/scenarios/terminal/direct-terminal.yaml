name: with endpoints disabled, a terminal attaches over Herdr's direct-terminal protocol and streams terminal-ANSI frames
family: terminal
description: >
  ROAMGATE_DISABLE_ENDPOINT=1: even a Herdr speaking endpoint generation 1
  is used through the direct-terminal client (TerminalHello, Welcome,
  AttachTerminal); its ANSI frames reach the browser as terminal pushes and
  typed input goes to Herdr as Input.
server:
  env: { ROAMGATE_DISABLE_ENDPOINT: "1" }
  herdr:
    endpoint: true
    workspaces: [{ workspace_id: w1, label: repo }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}", focused: true }]
    screens: { p1: "direct $ " }
steps:
  - login: {}
  - connect: {}
  - call: terminal.attach
    params: { terminal_id: term-p1, pane_id: p1, cols: 80, rows: 24 }
    golden: attach
  - expect_push: terminal
    golden: first-frame
    normalize: [uuid]
  - call: terminal.input
    params: { terminal_id: term-p1, pane_id: p1, data: bHMNCg== }
    reply: { ok: true }
  - herdr_calls:
      {
        method: client.input,
        min: 1,
        calls:
          { $contains: [{ params: { terminal_id: term-p1, data: "ls\r\n" } }] },
      }
  - herdr_calls: { method: endpoint.hello, count: 0 }
  - call: terminal.detach
    params: { terminal_id: term-p1 }
    reply: { ok: true }

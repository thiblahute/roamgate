name: comments reach the agent, by its watch, typed into its pane, on handoff and retry
family: review
description: >
  An agent opens a review of its branch and watches it. The user's comment
  wakes the watch; with nobody watching, comments are typed into the
  agent's pane after the delivery delay (the server's clock) through
  Herdr's agent.prompt; handoff and retry deliver at once. A watch with
  nothing to say times out on the clock.
# On Windows the server leaves comments to the review client (typed in
# the pane there), never its agent socket.
platforms: [linux, macos]
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: repo }]
    panes:
      [
        {
          pane_id: "w1:p1",
          workspace_id: w1,
          cwd: "${ROOT}/repo",
          agent: claude,
        },
      ]
    agents: [{ pane_id: "w1:p1", agent: claude, agent_status: idle }]
steps:
  - sh: |
      export GIT_AUTHOR_DATE=2025-12-31T12:00:00Z GIT_COMMITTER_DATE=2025-12-31T12:00:00Z
      git init -q repo && cd repo
      printf 'one\ntwo\n' > f.txt && git add f.txt && git commit -qm init
      git checkout -qb feature && printf 'one\nTWO\n' > f.txt && git commit -qam change
  - login: {}
  - connect: {}
  - agent: open
    body:
      {
        cwd: "${ROOT}/repo",
        agent: Claude,
        pane: "w1:p1",
        workspace: w1,
        range: main..feature,
      }
    expect: { status: 200 }
    save: { session: /json/session/id }
  - agent: watch
    no_wait: watch
    body:
      {
        cwd: "${ROOT}/repo",
        agent: Claude,
        session: "${session}",
        timeout: "600",
        mode: unanswered,
      }
  - call: review.thread.add
    params:
      {
        session_id: "${session}",
        kind: discussion,
        text: Please say why,
        anchor: { path: f.txt, line: 2 },
      }
    save: { thread: /result/id, comment: /result/comments/0/id }
  - await_http: watch
    expect:
      status: 200
      json:
        {
          outcome: "{{string}}",
          session: { id: "{{id}}" },
          threads:
            [
              {
                id: "{{id}}",
                repo: $ROOT/repo,
                comments: [{ text: Please say why }],
              },
            ],
        }
    golden: watch-woken
    normalize: [hex-id, run-paths]
  - herdr_calls: { method: agent.prompt, count: 0 }
  # Comments newer than the last delivery go next: time passes between
  # them, as it does for a user (the clock is the server's).
  - advance: 1000
  - call: review.thread.add
    params:
      {
        session_id: "${session}",
        kind: discussion,
        text: And this one?,
        anchor: { path: f.txt, line: 1 },
      }
    save: { second: /result/id }
  - advance: 2500
  - herdr_calls:
      {
        method: agent.prompt,
        min: 1,
        within_ms: 5000,
        calls:
          {
            $contains:
              [
                {
                  params:
                    { target: "w1:p1", text: "{{contains:And this one?}}" },
                },
              ],
          },
      }
  - agent: working
    body:
      {
        cwd: "${ROOT}/repo",
        agent: Claude,
        pane: "w1:p1",
        session: "${session}",
        done: "1",
        message: Answered,
      }
    expect: { status: 200, json: { agent: { name: Claude } } }
  - call: review.handoff
    params: { session_id: "${session}" }
    reply: { session: { id: "${session}", handoffAt: "{{string}}" } }
  - herdr_calls: { method: agent.prompt, min: 2, within_ms: 5000 }
  - call: review.retry
    params: { session_id: "${session}" }
    any_outcome: true
    golden: retry
    normalize: [hex-id, run-paths, iso-time]
  - agent: watch
    no_wait: quiet
    body:
      {
        cwd: "${ROOT}/repo",
        agent: Claude,
        session: "${session}",
        timeout: "60",
        mode: any,
      }
  - await_http: quiet
    advance_every: 60000
    expect: { status: 200, json: { outcome: "{{string}}" } }
    golden: watch-timeout
    normalize: [hex-id, run-paths, iso-time]

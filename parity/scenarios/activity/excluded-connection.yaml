name: an excluded connection is left out of the bridge's timeline and the CLI's days, not of its status
family: activity
ledger:
  - "server/src/cli/activity.test.ts > excluded connections are left out; --json gives the timeline"
  - "server/src/activity/timeline-rpc.test.ts > connections in exclude.connections are left out, as by the CLI"
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: work, focused: true }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: /work, focused: true }]
  files:
    .config/roamgate/settings.json:
      {
        json:
          {
            activity:
              { enabled: true, exclude: { connections: [legacy-default] } },
          },
      }
steps:
  - login: {}
  - connect: {}
  - advance: 600000
  - call: bridge.activity.timeline
    params: {}
    # The bridge's timeline leaves the excluded connection's spans out, as
    # the CLI does (contract 1.7; it kept them before).
    reply:
      {
        recording: true,
        days:
          [
            {
              date: "2026-01-01",
              focus: [],
              attention: [],
              totals: { attended_ms: 0, workspaces: [] },
            },
          ],
        workspaces: [],
      }
  - cli: [activity, day, "2026-01-01", --json]
    expect:
      {
        exit: 0,
        stdout_json:
          {
            recording: true,
            days:
              [
                {
                  date: "2026-01-01",
                  focus: [],
                  attention: [],
                  totals: { attended_ms: 0, workspaces: [] },
                },
              ],
            workspaces: [],
          },
      }
  - cli: [activity, status, --json]
    expect:
      { exit: 0, stdout_json: { retention_days: 90, connections: { $len: 1 } } }

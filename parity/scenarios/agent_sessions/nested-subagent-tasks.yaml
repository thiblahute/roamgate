name: the background tasks list the subagents' own subagents and commands, under the agent that started them, as told last
family: agent_sessions
description: >
  A coordinator started a lead, the lead a tester, the tester a helper and a
  background command; the coordinator then resumed the helper with a
  message. The list shows every one of them once, each under the agent that
  started it, the helper running from its resume, named by its meta file. A
  later end notice and a new subagent show at the next read, and a nested
  task opens like any other.
server:
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
    panes: [{ pane_id: p1, workspace_id: w1, cwd: /work, agent: claude }]
    agents:
      - pane_id: p1
        agent: claude
        agent_status: working
        cwd: /work
        agent_session:
          {
            source: claude,
            agent: claude,
            kind: id,
            value: 11111111-2222-4333-8444-555555555555,
          }

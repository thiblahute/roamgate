name: on a node profile, terminals and the host's agent socket go over the node link
family: connections
description: >
  With the link up, the runtime's render socket is a proxy whose streams
  go to the node's Herdr render socket over the link (terminal.attach,
  frames and input), and the host's agent socket is the node's: it listens
  on the path the review client setup prints and streams each connection
  back to the connection's agent socket here, with no `ssh -O forward -R`
  (contract/wire/node-link.md, Socket streams and node.listen).
server:
  start: false
  herdr: false
  herdrs:
    mac:
      endpoint: true
      workspaces: [{ workspace_id: w1, label: repo }]
      panes: [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}", focused: true }]
      screens: { p1: "node shell $ " }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ALLOW_SSH: "1"
    ROAMGATE_LOG_LEVEL: debug
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 2
        default_connection_id: mac
        profiles:
          - {
              id: mac,
              label: MAC,
              type: ssh,
              ssh_destination: mac.example.test,
              remote_control_socket_path: "${HERDR_mac_CONTROL}",
              remote_client_socket_path: "${HERDR_mac_CLIENT}",
              auto_connect: true,
              node: true,
            }
steps:
  - sh: mkdir -p "$D" && ln -s "$B" "$D/roamgate"
    env:
      D: "${ROOT}/remote-home/.local/share/roamgate-node/bin"
      B: "${SERVER_BIN}"
  - start: {}
  - login: {}
  - connect: {}
  - call: connections.connect
    id: up
    no_wait: true
    params: { id: mac }
  - await: up
    advance_every: 50
    reply: { state: ready, type: ssh }
  - expect_log: { contains: ["node link up connection=mac"] }
  - call: terminal.attach
    connection_id: mac
    params: { terminal_id: term-p1, pane_id: p1, cols: 80, rows: 24 }
    any_outcome: true
  - expect_push: terminal
    message: { terminal: "{{any}}" }
  - call: terminal.input
    connection_id: mac
    params: { terminal_id: term-p1, pane_id: p1, data: bHMNCg== }
    reply: { ok: true }
  - herdr_calls:
      {
        herdr: mac,
        method: endpoint.pane_input,
        min: 1,
        calls: { $contains: [{ params: { pane_id: p1 } }] },
      }
  # Only the probe, before the link was up, went through the tunnel.
  - expect_log: { contains: ["render stream connection=mac via=node"] }
  # The host's agent socket: the node's, streamed back to this connection's.
  - expect_log:
      contains: ["review client ready connection=mac via=node"]
      within_ms: 10000
  - agent: launch
    socket: "${ROOT}/remote-home/.cache/roamgate/review.sock"
    body: { pane: p1, token: 0123456789abcdef0123 }
    expect: { status: 404, json: { error: "{{contains:no such start}}" } }
  - fake_calls: { program: ssh, argv_match: "-O forward -R", count: 0 }

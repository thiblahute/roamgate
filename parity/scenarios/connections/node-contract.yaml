name: an SSH profile with node true whose node speaks another node contract keeps working over its tunnel and master
family: connections
description: >
  The host's node is of another build: its welcome names node contract 999.
  The server says once that the node is unavailable, ends the link, and the
  profile works as one without `node`: Herdr through the tunnel, host
  commands as ssh commands over the master (contract/wire/node-link.md,
  Handshake and Fallback).
# Its SSH host is this machine playing a POSIX host (the fake ssh runs its
# commands here, its paths are the run's), which Windows is not.
platforms: [linux, macos]
server:
  herdr: false
  herdrs:
    mac:
      version: 1.2.3
      workspaces: [{ workspace_id: w1, label: over-the-tunnel }]
      responses:
        integration.list:
          {
            type: integration_list,
            integrations:
              [
                {
                  target: sample_agent,
                  label: Sample Agent,
                  command: sample,
                  available: true,
                  state: outdated,
                },
              ],
          }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ALLOW_SSH: "1"
  fakes:
    herdr:
      rules:
        - { args: [--version], stdout: "herdr 1.2.3\n" }
        - {
            args: [integration, status],
            stdout: "sample-agent: outdated (v2 < v4)\n",
          }
  start: false
  files:
    "${ROOT}/old-node":
      text: |
        #!/bin/sh
        printf 'roamgate-node\n'
        exec python3 -c 'import json, struct, sys
        p = json.dumps({"t": "welcome", "protocol": 1, "side": "rust", "node": {"version": "0.0.1", "contract": 999}}).encode()
        sys.stdout.buffer.write(struct.pack("<I", len(p) + 1) + b"\0" + p)
        sys.stdout.flush()
        sys.stdin.buffer.read()'
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 2
        default_connection_id: mac
        profiles:
          - {
              id: mac,
              label: MAC,
              type: ssh,
              ssh_destination: mac.example.test,
              remote_control_socket_path: "${HERDR_mac_CONTROL}",
              remote_client_socket_path: "${HERDR_mac_CLIENT}",
              auto_connect: true,
              node: true,
            }
steps:
  # A node that answers the hello with another contract, then waits.
  - sh: mkdir -p "$D" && cp "$S" "$D/roamgate" && chmod 755 "$D/roamgate"
    env:
      D: "${ROOT}/remote-home/.local/share/roamgate-node/bin"
      S: "${ROOT}/old-node"
  - start: {}
  - login: {}
  - connect: {}
  - call: connections.connect
    id: up
    no_wait: true
    params: { id: mac }
  - await: up
    advance_every: 50
    reply: { state: ready, type: ssh }
    save: { generation: /result/generation }
  - expect_log:
      contains:
        ["node unavailable, using the SSH tunnel", "speaks node contract 999"]
      lacks: ["node link up"]
  - call: workspace.list
    connection_id: mac
    connection_generation: "${generation}"
    reply: { workspaces: [{ label: over-the-tunnel }] }
  - herdr_calls: { herdr: mac, all_valid: true, method: workspace.list, min: 1 }
  - call: integration.list
    connection_id: mac
    reply: { integrations: [{ target: sample_agent, installed_version: 2 }] }
  - fake_calls:
      {
        program: ssh,
        argv_match: " -- mac.example.test .*integration status",
        min: 1,
      }

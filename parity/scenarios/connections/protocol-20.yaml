name: "the default local connection checks Herdr's protocol 20 (Welcome same) before any other request: accepted"
family: connections
ledger:
  - 'server/src/connections/profile-process.test.ts > default local startup validates protocol ${JSON.stringify(protocol)} / Welcome ${welcomeProtocol ?? "same"} before background RPCs'
server:
  env: { ROAMGATE_NOTIFICATION_SOURCE: herdr }
  herdr:
    endpoint: false
    protocol: 20
    responses: { ping: { type: pong, version: "0.9.4", protocol: 20 } }
steps:
  - login: {}
  - connect: {}
  - call: connections.connect
    params: { id: legacy-default }
    reply: { state: ready }

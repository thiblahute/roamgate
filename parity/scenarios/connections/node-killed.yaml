name: a node link that dies falls back to the tunnel and the master's forward, then comes back
family: connections
description: >
  The node process is killed while the profile is ready: the link closes
  (logged once), Herdr calls go through the tunnel at once, the host's
  agent socket is forwarded again with `ssh -O forward -R` on the master,
  and the link is started again a second later, which moves the agent
  socket back to the node (contract/wire/node-link.md, Fallback).
fronts: [rust-only]
server:
  start: false
  herdr: false
  herdrs:
    mac:
      workspaces: [{ workspace_id: w1, label: still-there }]
      panes: [{ pane_id: "w1:p1", workspace_id: w1, cwd: "${ROOT}" }]
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ALLOW_SSH: "1"
    ROAMGATE_LOG_LEVEL: debug
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 2
        default_connection_id: mac
        profiles:
          - {
              id: mac,
              label: MAC,
              type: ssh,
              ssh_destination: mac.example.test,
              remote_control_socket_path: "${HERDR_mac_CONTROL}",
              remote_client_socket_path: "${HERDR_mac_CLIENT}",
              auto_connect: true,
              node: true,
            }
steps:
  - sh: mkdir -p "$D" && ln -s "$B" "$D/roamgate"
    env:
      D: "${ROOT}/remote-home/.local/share/roamgate-node/bin"
      B: "${SERVER_BIN}"
  - start: {}
  - login: {}
  - connect: {}
  - call: connections.connect
    id: up
    no_wait: true
    params: { id: mac }
  - await: up
    advance_every: 50
    reply: { state: ready, type: ssh }
    save: { generation: /result/generation }
  - expect_log:
      contains:
        [
          "node link up connection=mac",
          "review client ready connection=mac via=node",
        ]
      within_ms: 10000
  # The bracket keeps this shell's own command line from matching.
  - sh: pkill -KILL -f "$P"
    env:
      P: "${ROOT}/remote-home/.local/share/roamgate-node/bin/roamgat[e] node"
  - expect_log:
      contains: ["node link closed, using the SSH tunnel connection=mac"]
      within_ms: 10000
  - call: workspace.list
    connection_id: mac
    connection_generation: "${generation}"
    reply: { workspaces: [{ label: still-there }] }
  # Brought back after a second: the agent socket moves back to the node.
  - expect_log:
      matches: "(?s)node link closed.*review client ready connection=mac via=ssh.*node link up connection=mac.*review client ready connection=mac via=node"
      within_ms: 15000
  - call: workspace.list
    connection_id: mac
    connection_generation: "${generation}"
    reply: { workspaces: [{ label: still-there }] }
  - fake_calls: { program: ssh, argv_match: "-O forward -R", min: 1 }

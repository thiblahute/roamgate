name: a browser connected before the connections move between Bun and the Rust core is told of each new runtime
family: connections
description: >
  The owners table gives the host family to the Rust core, then back to
  Bun. Each handover replaces every connection's runtime with one of a
  newer generation. A browser that connected before it holds the old
  generation, so a page left in the background kept calling with it and
  was refused ("connection generation changed") until it read the catalog
  again. On each handover that browser gets the new runtime's
  session.resync_required push with the new generation, and the catalog
  already says that generation is ready when the push comes. The page reads
  the catalog again on that push, or on a call refused for the old
  generation, and its calls then go to the new runtime.
# Stage 1: the families' flip runs between the Bun server and the Rust core
# it spawns; a Rust front's Bun core runs no core of its own.
fronts: [bun]
server:
  env:
    ROAMGATE_CORE_BIN: "${CORE}"
  herdr:
    workspaces: [{ workspace_id: w1, label: work }]
  files:
    ".config/roamgate/runtime/owners.json":
      mode: "0600"
      json:
        version: 1
        owners: { host: bun }
        shadow: { enabled: false, rate: 0 }
steps:
  - login: {}
  - connect: {}
  - expect_push: "event:session.resync_required"
    message: { connection_id: legacy-default, connection_generation: 1 }
  - call: connections.list
    reply:
      connections:
        { $contains: [{ id: legacy-default, state: ready, generation: 1 }] }
  - call: workspace.list
    connection_id: legacy-default
    connection_generation: 1
    reply: { workspaces: [{ workspace_id: w1 }] }
  # Bun to the Rust core: the browser holding generation 1 is told of 3
  # (Bun's stop retired 2).
  - write:
      path: "${DATA}/runtime/owners.json"
      mode: "0600"
      json:
        version: 1
        owners: { host: rust }
        shadow: { enabled: false, rate: 0 }
  - expect_log:
      { contains: handing the connections to the Rust core, within_ms: 10000 }
  - expect_push: "event:session.resync_required"
    within_ms: 30000
    message: { connection_id: legacy-default, connection_generation: 3 }
  - call: connections.list
    reply:
      connections:
        { $contains: [{ id: legacy-default, state: ready, generation: 3 }] }
  - call: workspace.list
    connection_id: legacy-default
    connection_generation: 1
    envelope: { connection_id: legacy-default, connection_generation: 1 }
    error: { message: "connection generation changed: legacy-default" }
  - call: workspace.list
    connection_id: legacy-default
    connection_generation: 3
    reply: { workspaces: [{ workspace_id: w1 }] }
  # And back to Bun: told of 4.
  - write:
      path: "${DATA}/runtime/owners.json"
      mode: "0600"
      json:
        version: 1
        owners: { host: bun }
        shadow: { enabled: false, rate: 0 }
  - expect_log:
      {
        contains: taking the connections back from the Rust core,
        within_ms: 10000,
      }
  - expect_push: "event:session.resync_required"
    within_ms: 30000
    message: { connection_id: legacy-default, connection_generation: 4 }
  - call: connections.list
    reply:
      connections:
        { $contains: [{ id: legacy-default, state: ready, generation: 4 }] }
  - call: workspace.list
    connection_id: legacy-default
    connection_generation: 3
    envelope: { connection_id: legacy-default, connection_generation: 3 }
    error: { message: "connection generation changed: legacy-default" }
  - call: workspace.list
    connection_id: legacy-default
    connection_generation: 4
    reply: { workspaces: [{ workspace_id: w1 }] }

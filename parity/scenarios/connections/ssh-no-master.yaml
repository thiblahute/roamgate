name: with ROAMGATE_DISABLE_SSH_MASTER, SSH profiles connect without a ControlMaster
family: connections
description: >
  The same two SSH profiles as ssh-profiles.yaml, with masters turned off:
  each tunnel and command logs in on its own, and no ssh -M ever runs.
# Its SSH host is this machine playing a POSIX host (the fake ssh runs its
# commands here, its paths are the run's), which Windows is not.
platforms: [linux, macos]
server:
  herdr: false
  herdrs:
    alpha:
      {
        workspaces: [{ workspace_id: shared-workspace, label: from-ssh-alpha }],
      }
    beta:
      { workspaces: [{ workspace_id: shared-workspace, label: from-ssh-beta }] }
  env:
    ROAMGATE_CONNECTIONS_PATH: "${ROOT}/connections.json"
    ROAMGATE_ALLOW_SSH: "1"
    ROAMGATE_DISABLE_SSH_MASTER: "1"
  fakes:
    ssh:
      rules:
        - {
            args_match: "auth-fail",
            stderr: "Permission denied (publickey).\n",
            exit: 255,
          }
  files:
    "${ROOT}/connections.json":
      mode: "0600"
      json:
        version: 2
        default_connection_id: ssh-alpha
        profiles:
          - {
              id: ssh-alpha,
              label: SSH-ALPHA,
              type: ssh,
              ssh_destination: alpha-host,
              remote_control_socket_path: "${HERDR_alpha_CONTROL}",
              remote_client_socket_path: "${HERDR_alpha_CLIENT}",
              auto_connect: true,
            }
          - {
              id: ssh-beta,
              label: SSH-BETA,
              type: ssh,
              ssh_destination: beta-host,
              remote_control_socket_path: "${HERDR_beta_CONTROL}",
              remote_client_socket_path: "${HERDR_beta_CLIENT}",
              auto_connect: true,
            }
          - {
              id: ssh-auth,
              label: SSH-AUTH,
              type: ssh,
              ssh_destination: auth-fail,
              remote_control_socket_path: "${HERDR_alpha_CONTROL}",
              remote_client_socket_path: "${HERDR_alpha_CLIENT}",
              auto_connect: false,
            }
steps:
  - login: {}
  - connect: { expect_hello: { default_connection_id: ssh-alpha } }
  # The bridge polls for the tunnels' local sockets on its own clock.
  - call: connections.connect
    id: alpha
    no_wait: true
    params: { id: ssh-alpha }
  - await: alpha
    advance_every: 50
    reply: { state: ready, type: ssh }
    save: { alpha_generation: /result/generation }
  - call: connections.connect
    id: beta
    no_wait: true
    params: { id: ssh-beta }
  - await: beta
    advance_every: 50
    reply: { state: ready, type: ssh }
    save: { beta_generation: /result/generation }
  - call: workspace.list
    connection_id: ssh-alpha
    connection_generation: "${alpha_generation}"
    reply: { workspaces: [{ label: from-ssh-alpha }] }
  - call: workspace.list
    connection_id: ssh-beta
    connection_generation: "${beta_generation}"
    reply: { workspaces: [{ label: from-ssh-beta }] }
  - call: connections.connect
    id: auth
    no_wait: true
    params: { id: ssh-auth }
  - await: auth
    advance_every: 50
    error: { message: "{{string}}" }
  - fake_calls: { program: ssh, argv_match: "auth-fail", min: 1 }
  - herdr_calls:
      { herdr: alpha, all_valid: true, method: workspace.list, min: 1 }
  - herdr_calls:
      { herdr: beta, all_valid: true, method: workspace.list, min: 1 }

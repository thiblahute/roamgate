name: workspace files are downloaded with Range, uploaded and deleted over HTTP, and terminal uploads are staged privately
family: file
description: >
  The connection-scoped file routes and their legacy unscoped forms:
  download (whole, ranged, inline), upload into a directory, delete; the
  terminal upload staged in a private directory with its size limit
  (ROAMGATE_UPLOAD_MAX_BYTES); an image upload; and their refusals.
server:
  env: { ROAMGATE_UPLOAD_MAX_BYTES: "64", ROAMGATE_UPLOAD_RETENTION_HOURS: "2" }
  herdr:
    workspaces: [{ workspace_id: w1, label: repo }]
    panes:
      [{ pane_id: p1, workspace_id: w1, cwd: "${ROOT}/repo", focused: true }]
steps:
  - sh: mkdir -p repo/docs && printf '0123456789abcdef' > repo/data.bin && printf '# hi\n' > repo/docs/a.md
  - login: {}
  - http: GET /api/connections/legacy-default/file/download?workspace_id=w1&path=data.bin
    expect:
      status: 200
      text: "0123456789abcdef"
      headers:
        {
          content-disposition: "{{contains:attachment}}",
          content-type: "{{string}}",
        }
    golden: download
    normalize: [run-paths]
  - http: GET /api/connections/legacy-default/file/download?workspace_id=w1&path=data.bin
    headers: { range: bytes=4-7 }
    expect:
      { status: 206, text: "4567", headers: { content-range: bytes 4-7/16 } }
  - http: GET /api/file/download?workspace_id=w1&path=docs/a.md&inline=1
    expect:
      {
        status: 200,
        text: "# hi\n",
        headers: { content-disposition: "{{contains:attachment}}" },
      }
  - http: GET /api/file/download?workspace_id=w1&path=../../etc/passwd
    expect: { status: 400 }
  - http: POST /api/connections/legacy-default/file/upload?workspace_id=w1&directory=docs&filename=new.txt
    text: "uploaded body"
    headers: { content-type: application/octet-stream }
    normalize: [run-paths]
    golden: upload
    expect: { status: 200 }
  - assert_file: { path: "${ROOT}/repo/docs/new.txt", text: "uploaded body" }
  - http: POST /api/file/upload?workspace_id=w1&directory=docs&filename=../escape.txt
    text: "x"
    expect: { status: 400 }
  - http: POST /api/connections/legacy-default/file/delete?workspace_id=w1&path=docs/new.txt
    normalize: [run-paths]
    golden: delete
    expect: { status: 200 }
  - assert_absent: "${ROOT}/repo/docs/new.txt"
  - http: POST /api/file/delete?workspace_id=w1&path=docs/new.txt
    expect: { status: 400 }
  - http: POST /api/connections/legacy-default/terminal-upload?filename=shot.png
    text: "png bytes"
    headers: { content-type: application/octet-stream }
    expect:
      {
        status: 200,
        json: { remote: false, path: "{{string}}", text: "{{string}}" },
      }
    save: { staged: /json/path }
  - assert_file: { path: "${staged}", text: "png bytes", mode: "0600" }
  - http: POST /api/terminal-upload?filename=big.bin
    text: "0123456789012345678901234567890123456789012345678901234567890123456789"
    expect: { status: 413, json: { error: "{{contains:too large}}" } }
  - http: POST /api/terminal-upload
    text: "x"
    expect: { status: 400, json: { error: filename is required } }
  - http: POST /api/connections/legacy-default/upload-image
    text: "not an image"
    headers: { content-type: image/png }
    normalize: [run-paths]
    expect:
      {
        status: 200,
        json:
          {
            remote: false,
            path: "{{re:^\\$ROOT/tmp/roamgate-uploads-([0-9]+|user)/upload-[^/]+/img-1767225600000-[a-z0-9]+\\.png$}}",
            text: "{{string}}",
          },
      }
  - http: POST /api/upload-image
    text: ""
    golden: upload-image-empty

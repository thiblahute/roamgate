[package]
name = "roamgate-voice"
version = "0.1.0"
edition = "2024"
description = "Roamgate's voice helper: speech to text with whispertranscriber, text to speech with kokorosynthesizer, anyttssynthesizer or Pocket TTS, and voice cloning for Qwen3-TTS"
license = "MIT"
publish = false

[dependencies]
# The frame codec, shared with the server and the parity fake.
roamgate-protocol = { path = "../../crates/roamgate-protocol" }
# Which language a sentence is read in: only the voices' languages.
lingua = { version = "1.8", default-features = false, features = ["chinese", "english", "french", "hindi", "italian", "japanese", "portuguese", "spanish"] }
# GStreamer, its plugins and ours are all linked into the binary: the
# `binary` feature builds against GStreamer's official prebuilt bundle.
gst = { package = "gstreamer", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary", "v1_28"] }
gst-audio = { package = "gstreamer-audio", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary", "v1_20"] }
gst-app = { package = "gstreamer-app", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
# The call's process tap source (processtap.rs) is a PushSrc.
gst-base = { package = "gstreamer-base", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
gst-plugin-whisper = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static"] }
# audiornnoise: RNNoise's denoiser, and its voice activity verdict.
gst-plugin-audiofx = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static"] }
gst-plugin-kokoro = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static"] }
# parakeettranscriber: Parakeet TDT speech to text.
gst-plugin-parakeet = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static"] }
# speechgate: lets through only speech, and ends each utterance.
gst-plugin-speechgate = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static"] }
# anyttssynthesizer: any-tts's models (Qwen3-TTS...).
gst-plugin-anytts = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static"] }
# webrtcsink and webrtcsrc (call.rs): a call's audio is a WebRTC call with
# the page, signalled with GStreamer's WebRTC signalling protocol. None of
# the other signallers (Janus, WHIP, WHEP, AWS, LiveKit...) is built.
gst-plugin-webrtc = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", default-features = false, features = ["static", "rustls-ring"] }
# reqwesthttpsrc (youtube.rs): a YouTube video's audio stream, read over
# HTTPS with rustls (ring, as webrtcsink's) and the system's certificates.
gst-plugin-reqwest = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", default-features = false, features = ["static", "rustls-ring"] }
# The libraries webrtcsink and webrtcsrc use, from the prebuilt bundle.
gst-webrtc = { package = "gstreamer-webrtc", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
gst-sdp = { package = "gstreamer-sdp", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
gst-rtp = { package = "gstreamer-rtp", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
gst-pbutils = { package = "gstreamer-pbutils", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
gst-video = { package = "gstreamer-video", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
gst-net = { package = "gstreamer-net", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", branch = "main", features = ["binary"] }
# Cloning voices for Qwen3-TTS (clone.rs): its speaker encoder, and its
# speech tokenizer's encoder (Mimi), the versions any-tts uses.
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
realfft = "3.5"
# Whisper's language identification and reading (reread.rs), from the
# same whisper.cpp build as whispertranscriber.
whisper-rs = "0.16"
# Whisper's CUDA backend, a ggml module loaded at run time (gpu.rs).
whisper-rs-sys = "0.15"
# Who speaks (voices.rs): WeSpeaker's speaker embeddings, with the
# ONNX Runtime speechgate's speaker check uses.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Pocket TTS (src/pocket): Kyutai's model on xn-ptts, the commit Kyutai's
# pocket-tts binary pins (its API still moves), on the CPU only, and what
# the code taken from that binary uses: its tokenizer.json, its noise.
ptts = { git = "https://github.com/gabrieldemarmiesse/xn-ptts", rev = "7efa26973f81bba42cf2ace8da2c1eb9b605d54d", default-features = false }
# The version ptts uses: its tensors cross the boundary.
xn = "0.2.11"
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }
anyhow = "1"
half = "2"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.5"

# The GStreamer plugins linked in, from the prebuilt bundle.
[package.metadata.gstreamer-plugins]
include = [
    "coreelements",
    "app",
    "typefindfunctions",
    "playback",
    # matroska and opus: also a YouTube video's WebM with Opus
    # (call/youtube.rs); no AAC decoder is linked, so no M4A.
    "matroska",
    "wavparse",
    "opus",
    "ogg",
    "audioconvert",
    "audioresample",
    # soundtouch's pitch: a sentence made faster keeps its pitch. Its C++
    # runtime is linked by .cargo/config.toml.
    "soundtouch",
    # A call's mix (call.rs): the mixer, its silent floor, and what a
    # call_background description may use.
    "audiomixer",
    "audiotestsrc",
    "volume",
    # A call's WebRTC (webrtcsink, webrtcsrc): webrtcbin, ICE (libnice),
    # DTLS, SRTP, RTP sessions and Opus payloading.
    "webrtc",
    "nice",
    "dtls",
    "srtp",
    "rtpmanager",
    "rtp",
    # errorignore, in webrtcsink's codec discovery.
    "debugutilsbad",
    # rawaudioparse: a call_background reading raw audio from a file or a
    # FIFO, such as a sound server's recording of a music player.
    "rawparse",
    # pulsesrc: on Linux, a call_background recording a sound server's
    # device, such as the monitor of a sink a music player plays to. It
    # links the host's libpulse (PipeWire's pipewire-pulse serves it).
    "pulseaudio",
    # webrtcdsp and webrtcechoprobe (echo.rs): a call's microphone has the
    # replies' echo taken out here when the page plays them on a phone's
    # loudspeaker without its own echo canceller.
    "webrtcdsp",
]

# The prebuilt bundles: GStreamer 1.28.8, the one the helper is built and
# tested with (the locked gstreamer-sys names 1.28.7). On macOS, the
# official package; on Linux (x86-64), the bundle gstreamer-sys's prebuilt
# support names, as GStreamer publishes none for Linux. Read by
# system-deps, this package's metadata overriding its dependencies'.
[package.metadata.system-deps.gstreamer_1_0.'cfg(target_os = "macos")']
url = "https://gstreamer.freedesktop.org/data/pkg/macos/1.28.8/gstreamer-1.0-devel-1.28.8-universal.pkg"
checksum = "e6d380bc17be7eccf13e0154567d4718fc9321da822408c7ca0cd808b3d4a3f7"

[package.metadata.system-deps.gstreamer_1_0.'cfg(target_os = "linux")']
url = "https://people.freedesktop.org/~tsaunier/gstreamer/pkg/linux/1.28.8/gstreamer-1.0-linux-x86_64-1.28.8.tar.xz"
checksum = "b6f5a061950541f419e1cccc3559e2154779140d8d051a4cfad395481fc081cd"

[target.'cfg(unix)'.dependencies]
# A call's ICE addresses (call.rs): getifaddrs.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# osxprocesstapsrc (processtap.rs): CATapDescription and its dictionaries.
objc2 = "0.6"
objc2-foundation = "0.3"
# whisper.cpp and any-tts's models on the GPU: Metal on macOS.
gst-plugin-whisper = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static", "metal"] }
gst-plugin-anytts = { git = "https://gitlab.freedesktop.org/thiblahute/gst-plugins-rs", branch = "roamgate-voice", features = ["static", "metal"] }

[features]
# any-tts's models on NVIDIA GPUs with CUDA (Linux and Windows), built with
# the CUDA toolkit (linux/build.sh). Whisper's CUDA backend is not a
# feature: it is a module loaded at run time when present (gpu.rs).
cuda = ["gst-plugin-anytts/cuda"]

# Its own workspace, with its own Cargo.lock: the repository's workspace
# excludes it, so building the server never resolves the git dependencies
# below. The crates it shares with the server (crates/) are path
# dependencies.
[workspace]

[profile.release]
strip = true

# gstreamer-rs's prebuilt bundle support, until it is
# merged: https://gitlab.freedesktop.org/gstreamer/gstreamer-rs/-/merge_requests/1980
[patch."https://gitlab.freedesktop.org/gstreamer/gstreamer-rs"]
gstreamer = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-base = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-base-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-audio = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-audio-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-app = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-app-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-tag = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-tag-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-webrtc = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-webrtc-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-sdp = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-sdp-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-rtp = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-rtp-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-pbutils = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-pbutils-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-video = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-video-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-net = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-net-sys = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }
gstreamer-utils = { git = "https://gitlab.freedesktop.org/calvaris/gstreamer-rs", branch = "binaries" }

# any-tts with the Metal and CUDA speedups, streaming
# Qwen3-TTS decoding and voice cloning, until they are merged upstream.
[patch.crates-io]
any-tts = { git = "https://github.com/thiblahute/any-tts", branch = "roamgate-runtime-cuda" }

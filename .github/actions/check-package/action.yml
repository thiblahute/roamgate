name: Check a package on its platform
description: >
  On the target's own runner: the package's smoke test (cargo xtask smoke:
  roamgate-pi, the server with a login, /healthz, the /ws hello, an
  agent-socket call), again in the target's container when targets.toml
  names one, and for a target `roamgate update` serves, the last published
  release updating itself to the package (cargo xtask update-proof). The
  package is in target/dist, the web app in server/public.

inputs:
  platform:
    description: The target's platform (targets.toml)
    required: true
  version:
    description: The packaged version
    required: true
  container:
    description: The target's container image, if any
    required: false
    default: ""
  update:
    description: Whether `roamgate update` installs the target
    required: true
  release-updates:
    description: >
      Whether the last published release's updater installs the target;
      if not, the proof updates the artifact update-from-<platform>
    required: true
  token:
    description: A token for gh release download
    required: true

runs:
  using: composite
  steps:
    # Not every runner image has Rust; rustup puts it in ~/.cargo/bin,
    # which each step below puts first on its PATH.
    - name: Install Rust
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if command -v cargo >/dev/null; then exit 0; fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Windows-ARM64) curl -sSfLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe ;;
          Windows-*) curl -sSfLo "$RUNNER_TEMP/rustup-init.exe" https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe ;;
        esac
        if [ "$RUNNER_OS" = Windows ]; then
          "$RUNNER_TEMP/rustup-init.exe" -y --profile minimal
        else
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        fi
    # A target with a container runs there only: it is that system's
    # (musl's roamgate-pi needs musl's loader, which the runner lacks).
    - name: Smoke-test the package
      if: inputs.container == ''
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo xtask smoke "$PLATFORM" --version "$VERSION"
    - name: Smoke-test the package in its container
      if: inputs.container != ''
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo xtask smoke "$PLATFORM" --version "$VERSION" --container
    # Existing installs update in place: the last published release's
    # binary updates itself to this package in a sandbox, or, for a target
    # no release can update yet, an earlier build of this checkout.
    - if: inputs.update == 'true' && inputs.release-updates != 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: update-from-${{ inputs.platform }}
        path: target/dist-from
    - name: Update an earlier roamgate to it
      if: inputs.update == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PLATFORM: ${{ inputs.platform }}
        VERSION: ${{ inputs.version }}
        RELEASE_UPDATES: ${{ inputs.release-updates }}
        CONTAINER: ${{ inputs.container }}
        # Releases are published upstream; a fork has none to update from.
        RELEASES_REPO: powerfooI/roamgate
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if [ "$RELEASE_UPDATES" = true ]; then
          # The latest release but the one this run publishes.
          previous="$(gh release list --repo "$RELEASES_REPO" --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '[.[] | select(.tagName != env.GITHUB_REF_NAME)][0].tagName // ""')"
          if [ -z "$previous" ]; then
            echo "No earlier release to update from."
            exit 0
          fi
          from="$RUNNER_TEMP/previous"
          mkdir -p "$from"
          gh release download "$previous" --repo "$RELEASES_REPO" \
            --pattern "roamgate-$PLATFORM.tar.xz" --dir "$from"
          archive="$from/roamgate-$PLATFORM.tar.xz"
        else
          archive="$(ls target/dist-from/roamgate-"$PLATFORM".tar.xz target/dist-from/roamgate-"$PLATFORM".zip 2>/dev/null | head -n 1)"
        fi
        # In the target's container when it has one (musl: Alpine).
        set -- --archive "$archive" --version "$VERSION"
        if [ -n "$CONTAINER" ]; then set -- "$@" --container; fi
        cargo xtask update-proof "$PLATFORM" "$@"

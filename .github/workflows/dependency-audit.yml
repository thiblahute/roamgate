name: Dependency Audit

on:
  pull_request:
    paths:
      - "**/package.json"
      - "bun.lock"
      - "**/bunfig.toml"
      - "**/.npmrc"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      # Audit the lockfile directly, including dev dependencies, without
      # installing packages or running lifecycle scripts. JSON retains
      # lower-severity findings; high/critical findings fail the job.
      - run: bun audit --json --audit-level=high

  # The Rust workspace: RustSec advisories, licences, bans and sources
  # (deny.toml), from Cargo.lock without building anything.
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny
      - run: cargo deny check

name: CI

on:
  pull_request:
  # ci/** branches run it on a fork, where workflow_dispatch reaches only
  # the workflows of the default branch; a ci/*release* branch runs the
  # release dry run instead, which checks the same and more.
  push:
    branches: [main, "ci/**", "!ci/*release*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:bun
      - run: bun run build:site
      - run: bun run test:quick

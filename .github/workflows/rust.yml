name: Rust

# The Cargo workspace: format, lints and tests (with the parity suite against
# this checkout's server), then every release target of targets.toml built,
# packaged and verified (cargo xtask), run on a runner of its own platform,
# and installed through the last published release's `roamgate update`
# where the updater serves that platform. The packages are CI artifacts
# here; the Release workflow builds the published ones the same way.

on:
  pull_request:
  # ci/** branches run it on a fork, where workflow_dispatch reaches only
  # the workflows of the default branch; a ci/*release* branch runs the
  # release dry run instead, which checks the same and more.
  push:
    branches: [main, "ci/**", "!ci/*release*"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push of the same branch replaces a run still going.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt, then clippy, nextest and the parity suite on Linux, macOS and
  # Windows (the Release workflow runs the same before it publishes).
  checks:
    name: Checks
    uses: ./.github/workflows/rust-checks.yml

  targets:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      version: ${{ steps.targets.outputs.version }}
      packages: ${{ steps.targets.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: targets
        # The packages carry a version above the last release's, so that
        # the update proof has something to update to.
        run: |
          echo "targets=$(cargo xtask targets --json)" >> "$GITHUB_OUTPUT"
          echo "version=$(cargo xtask version --next)" >> "$GITHUB_OUTPUT"
          # A ci/** push runs the checks only, unless its branch is about
          # the packages (the fork's runners are few): ci/*package*,
          # ci/*smoke*, ci/*full*, ci/ci-runners-*.
          packages=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              ci/*package* | ci/*smoke* | ci/*full* | ci/ci-runners-*) ;;
              ci/*) packages=false ;;
            esac
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  web:
    name: Web app
    needs: targets
    if: needs.targets.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web
          path: server/public
          if-no-files-found: error

  # Each target packaged on its runner, then checked on its platform.
  target:
    name: ${{ matrix.target.platform }}
    needs: [targets, web]
    if: needs.targets.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    uses: ./.github/workflows/rust-target.yml
    with:
      target: ${{ toJSON(matrix.target) }}
      version: ${{ needs.targets.outputs.version }}
      artifact: rust-roamgate-${{ matrix.target.platform }}

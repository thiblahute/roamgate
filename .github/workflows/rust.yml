name: Rust

# The Cargo workspace: format, lints and tests (with the parity suite against
# this checkout's server), then every release target of targets.toml built,
# packaged and verified (cargo xtask), run on a runner of its own platform,
# and installed through the last published release's `roamgate update`
# where the updater serves that platform. The packages are CI artifacts
# here; the Release workflow builds the published ones the same way.

on:
  pull_request:
  # ci/** branches run it on a fork, where workflow_dispatch reaches only
  # the workflows of the default branch; a ci/*release* branch runs the
  # release dry run instead, which checks the same and more.
  push:
    branches: [main, "ci/**", "!ci/*release*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  checks:
    name: clippy, nextest, parity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # macOS and Windows are not green yet; they report without failing the
    # run until they are.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      # The server embeds the web app; the parity suite compiles the Pi
      # sidecar with Bun.
      - run: bun run build:web
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        id: tools
        with:
          tool: cargo-nextest
      # Each check runs even when the one before failed, so one failure
      # does not hide the others; none runs without the tools.
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: nextest
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: cargo nextest run --locked --no-fail-fast -E 'not package(roamgate-parity)'
      - name: parity
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          PARITY_GATE_STRICT: "1"
        run: cargo nextest run --locked --no-fail-fast -p roamgate-parity

  targets:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: targets
        # The packages carry a version above the last release's, so that
        # the update proof has something to update to.
        run: |
          echo "targets=$(cargo xtask targets --json)" >> "$GITHUB_OUTPUT"
          echo "version=$(cargo xtask version --next)" >> "$GITHUB_OUTPUT"

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web
          path: server/public
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target.platform }}
    needs: [targets, web]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Bun compiles the Pi sidecar roamgate-pi for the target.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - uses: ./.github/actions/rust-builder
        with:
          triple: ${{ matrix.target.triple }}
          builder: ${{ matrix.target.builder }}
      - name: Build, package and verify
        shell: bash
        run: cargo xtask package "${{ matrix.target.platform }}" --version "${{ needs.targets.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-roamgate-${{ matrix.target.platform }}
          path: |
            target/dist/roamgate-v*-${{ matrix.target.platform }}.*
            target/dist/roamgate-${{ matrix.target.platform }}.*
          if-no-files-found: error

  check:
    name: Smoke ${{ matrix.target.platform }}
    needs: [targets, web, package]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.check }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-roamgate-${{ matrix.target.platform }}
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - uses: ./.github/actions/check-package
        with:
          platform: ${{ matrix.target.platform }}
          version: ${{ needs.targets.outputs.version }}
          container: ${{ matrix.target.container }}
          update: ${{ matrix.target.update }}
          token: ${{ github.token }}

name: Rust

# The Cargo workspace: format, lints and tests (with the parity suite against
# this checkout's server), then every release target of targets.toml built,
# packaged and verified (cargo xtask), run on a runner of its own platform,
# and installed through the last published release's `roamgate update`
# where the updater serves that platform. The packages are CI artifacts
# here; the Release workflow builds the published ones the same way.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, nextest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      # The server embeds the web app; the parity suite compiles the Pi
      # sidecar with Bun.
      - run: bun run build:web
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-fail-fast

  targets:
    name: Targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      version: ${{ steps.targets.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: targets
        # The packages carry a version above the last release's, so that
        # the update proof has something to update to.
        run: |
          echo "targets=$(cargo xtask targets --json)" >> "$GITHUB_OUTPUT"
          echo "version=$(cargo xtask version --next)" >> "$GITHUB_OUTPUT"

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bun run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web
          path: server/public
          if-no-files-found: error

  package:
    name: Package ${{ matrix.target.platform }}
    needs: [targets, web]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Bun compiles the Pi sidecar roamgate-pi for the target.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - name: Install Rust and the builder
        shell: bash
        run: |
          rustup target add "${{ matrix.target.triple }}"
          case "${{ matrix.target.builder }}" in
            zigbuild)
              python3 -m pip install --user ziglang
              cargo install --locked cargo-zigbuild
              ;;
            xwin)
              cargo install --locked cargo-xwin
              ;;
          esac
      - name: Build, package and verify
        shell: bash
        run: cargo xtask package "${{ matrix.target.platform }}" --version "${{ needs.targets.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-roamgate-${{ matrix.target.platform }}
          path: |
            target/dist/roamgate-*${{ matrix.target.platform }}.tar.xz*
            target/dist/roamgate-${{ matrix.target.platform }}.update.json
          if-no-files-found: error

  check:
    name: Run ${{ matrix.target.platform }}
    needs: [targets, web, package]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.check }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-roamgate-${{ matrix.target.platform }}
          path: target/dist
      - name: Run the packaged binary
        shell: bash
        run: |
          version="${{ needs.targets.outputs.version }}"
          platform="${{ matrix.target.platform }}"
          dir="$RUNNER_TEMP/run"
          mkdir -p "$dir"
          tar -xJf "target/dist/roamgate-v$version-$platform.tar.xz" -C "$dir"
          grep -Fx "roamgate $version $platform" "$dir/roamgate-$platform/VERSION"
          test "$("$dir/roamgate-$platform/${{ matrix.target.binary }}" --version | tr -d '\r')" = "roamgate $version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: matrix.target.update
        with:
          name: web
          path: server/public
      # Existing installs update in place: the last published release's
      # binary updates itself to this package in a sandbox.
      - name: Update the last release to it
        if: matrix.target.update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v cargo >/dev/null || {
            curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            export PATH="$HOME/.cargo/bin:$PATH"
          }
          platform="${{ matrix.target.platform }}"
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$previous" ]; then
            echo "No release to update from."
            exit 0
          fi
          from="$RUNNER_TEMP/previous"
          mkdir -p "$from"
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
            --pattern "roamgate-$platform.tar.xz" --dir "$from"
          tar -xJf "$from/roamgate-$platform.tar.xz" -C "$from" "roamgate-$platform/roamgate"
          cargo xtask update-proof "$platform" \
            --from "$from/roamgate-$platform/roamgate" \
            --version "${{ needs.targets.outputs.version }}"

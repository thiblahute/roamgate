name: Rust target

# One release target of targets.toml: built, packaged and verified on its
# runner (cargo xtask package), then smoke-tested and update-proved on the
# runner of its own platform (.github/actions/check-package). Called per
# target by the Rust and Release workflows, so that a target's check starts
# once its own package is built. The caller's run has the web app as the
# artifact `web`.

on:
  workflow_call:
    inputs:
      target:
        description: The target, as an entry of `cargo xtask targets --json`
        required: true
        type: string
      version:
        description: The version packaged
        required: true
        type: string
      artifact:
        description: The name of the package's artifact
        required: true
        type: string
      retention-days:
        description: How long the artifacts stay
        required: false
        type: number
        default: 7

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.target.platform }}
    strategy:
      matrix:
        target: ${{ fromJSON(format('[{0}]', inputs.target)) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Bun compiles the Pi sidecar roamgate-pi from the workspace's
      # packages for the target.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - uses: ./.github/actions/rust-builder
        with:
          triple: ${{ matrix.target.triple }}
          builder: ${{ matrix.target.builder }}
      # cargo xtask verify: checksums, update manifest, layout, modes and
      # binary kinds.
      - name: Build, package and verify
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: cargo xtask package "${{ matrix.target.platform }}" --version "$VERSION"
      - if: matrix.target.update && !matrix.target.release_updates
        uses: ./.github/actions/update-from
        with:
          platform: ${{ matrix.target.platform }}
          version: ${{ inputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact }}
          # The versioned and latest archives, their checksums and the
          # update manifest (cargo xtask package verified them).
          path: |
            target/dist/roamgate-v*-${{ matrix.target.platform }}.*
            target/dist/roamgate-${{ matrix.target.platform }}.*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  check:
    name: Smoke ${{ matrix.target.platform }}
    needs: package
    strategy:
      matrix:
        target: ${{ fromJSON(format('[{0}]', inputs.target)) }}
    runs-on: ${{ matrix.target.check }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.artifact }}
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - uses: ./.github/actions/check-package
        with:
          platform: ${{ matrix.target.platform }}
          version: ${{ inputs.version }}
          container: ${{ matrix.target.container }}
          update: ${{ matrix.target.update }}
          release-updates: ${{ matrix.target.release_updates }}
          token: ${{ github.token }}
      # The documented install line (site/install.json) run as shown, then
      # `roamgate` and its `roamgate url` login link, against this package
      # from a loopback mirror (cargo xtask getting-started).
      - name: Getting started
        shell: bash
        env:
          PLATFORM: ${{ matrix.target.platform }}
          VERSION: ${{ inputs.version }}
          CONTAINER: ${{ matrix.target.container }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          set -- "$PLATFORM" --version "$VERSION"
          if [ -n "$CONTAINER" ]; then set -- "$@" --container; fi
          cargo xtask getting-started "$@"

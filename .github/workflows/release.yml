name: Release

# A run on a v* tag publishes that release. A run on any other ref (a push
# of a ci/*release* branch, or a dispatch on a branch) is a dry run: it validates, builds, packages,
# smokes and update-proves every target with the next patch version, and
# publishes nothing: the publish job, the only one with write permissions,
# runs only on refs/tags/v*.
on:
  push:
    tags: ["v*"]
    # Dry runs on a fork, where workflow_dispatch reaches only the
    # workflows of the default branch.
    branches: ["ci/*release*"]
  # Allows the Publish Release workflow (or a maintainer) to dispatch a run
  # on an existing tag ref, and a dry run on a branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - name: Verify release metadata
        id: version
        shell: bash
        run: |
          package_version="$(bun -e 'console.log(require("./package.json").version)')"
          web_version="$(bun -e 'console.log(require("./web/package.json").version)')"
          server_version="$(bun -e 'console.log(require("./server/package.json").version)')"

          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$web_version" = "$package_version"
          test "$server_version" = "$package_version"
          # The binary's version is the Cargo workspace's.
          test "$(cargo xtask version)" = "$package_version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$package_version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            version="$package_version"
          else
            # A dry run: packages above the last release, so that the
            # update proof has something to update to.
            version="$(cargo xtask version --next)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun run precommit

  # The Rust workspace's checks on Linux, macOS and Windows, as the Rust
  # workflow runs them on pull requests: a tag never publishes untested.
  checks:
    name: Rust checks
    needs: validate
    uses: ./.github/workflows/rust-checks.yml

  targets:
    name: Targets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Every target of targets.toml, each built on its runner.
      - id: targets
        run: echo "targets=$(cargo xtask targets --json)" >> "$GITHUB_OUTPUT"

  web:
    name: Web app
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      # Built once; every target embeds the same web app.
      - run: bun run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web
          path: server/public
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.target.platform }}
    needs: [validate, targets, web]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Bun compiles the Pi sidecar roamgate-pi from the workspace's
      # packages for the target.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
          no-cache: true
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - uses: ./.github/actions/rust-builder
        with:
          triple: ${{ matrix.target.triple }}
          builder: ${{ matrix.target.builder }}
      # cargo xtask verify: checksums, update manifest, layout, modes and
      # binary kinds.
      - name: Build, package and verify
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: cargo xtask package "${{ matrix.target.platform }}" --version "$VERSION"
      - if: matrix.target.update && !matrix.target.release_updates
        uses: ./.github/actions/update-from
        with:
          platform: ${{ matrix.target.platform }}
          version: ${{ needs.validate.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: roamgate-${{ matrix.target.platform }}
          # The versioned and latest archives, their checksums and the
          # update manifest (cargo xtask package verified them).
          path: |
            target/dist/roamgate-v*-${{ matrix.target.platform }}.*
            target/dist/roamgate-${{ matrix.target.platform }}.*
          if-no-files-found: error
          retention-days: 7

  check:
    name: Smoke ${{ matrix.target.platform }}
    needs: [validate, targets, web, package]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    runs-on: ${{ matrix.target.check }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: roamgate-${{ matrix.target.platform }}
          path: target/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web
          path: server/public
      - uses: ./.github/actions/check-package
        with:
          platform: ${{ matrix.target.platform }}
          version: ${{ needs.validate.outputs.version }}
          container: ${{ matrix.target.container }}
          update: ${{ matrix.target.update }}
          release-updates: ${{ matrix.target.release_updates }}
          token: ${{ github.token }}

  publish:
    name: Publish GitHub Release
    needs: [validate, checks, package, check]
    # Only a v* tag publishes; a dry run on a branch stops before this job.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The build provenance attestation of the assets.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          pattern: roamgate-*
          merge-multiple: true
      - name: Reject missing assets and legacy update aliases
        run: node scripts/check-release-assets.mjs "${GITHUB_REF_NAME#v}"
      # Signed SLSA build provenance for every asset, verifiable with
      # `gh attestation verify <file> -R <this repository>`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/roamgate-*
            scripts/install-roamgate.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/roamgate-*.tar.xz
          dist/roamgate-*.tar.xz.sha256
          dist/roamgate-*.update.json
          scripts/install-roamgate.sh
          --verify-tag
          --latest
          --generate-notes
          --title "Roamgate $GITHUB_REF_NAME"

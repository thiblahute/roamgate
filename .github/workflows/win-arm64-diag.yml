name: win-arm64 diag

# Temporary diagnostic (never landed): why the windows-arm64 roamgate.exe
# crashes (0xc0000005) at exit after `--version`.

on:
  push:
    branches: ["ci/win-arm64-diag*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-builder
        with:
          triple: aarch64-pc-windows-msvc
          builder: xwin
      - name: Build variants
        shell: bash
        run: bash .github/diag/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bins
          path: out
          if-no-files-found: error

  native:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build natively
        shell: bash
        run: bash .github/diag/native.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native
          path: out
          if-no-files-found: error

  run:
    needs: [build, native]
    if: always()
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bins
          path: bins/xwin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          name: native
          path: bins/native
      - name: Run variants
        shell: pwsh
        run: ./.github/diag/run.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: dumps
          path: dumps
          if-no-files-found: ignore
